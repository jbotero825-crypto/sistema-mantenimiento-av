<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f3f4f6; --bg2:#e8ebee; --panel:#ffffff; --panel2:#eef1f4;
  --line:#dde1e6; --line2:#c7ced8;
  --txt:#182430; --txt2:#57657a; --txt3:#8592a3;
  --acc:#0f4c81; --acc2:#0c3c69; --accg:linear-gradient(135deg,#12578f,#0d3f6d);
  --ok:#1f8a4c; --warn:#b8790a; --bad:#c23b3b; --info:#6a4fb0;
  --orange:#d9622b; --orange2:#c1541f;
  --side-bg:#0f2338; --side-bg2:#1c3d57; --side-line:#20405c;
  --side-txt:#eef4fa; --side-txt2:#93a9bd; --side-acc:#e2853f;
  --r:10px; --sh:0 1px 2px rgba(16,24,40,.05),0 10px 26px rgba(16,24,40,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--txt); font-size:14px; overflow:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 12% -5%,rgba(15,76,129,.05),transparent 60%),
             radial-gradient(800px 500px at 100% 0%,rgba(217,98,43,.04),transparent 55%);}
#app{display:flex;height:100vh;position:relative;z-index:1}

/* ---------- SIDEBAR ---------- */
#side{width:250px;flex:0 0 250px;background:linear-gradient(180deg,var(--side-bg),#0a1a29);
  border-right:1px solid var(--side-line);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--side-line)}
.brand h1{font-size:15px;letter-spacing:.5px;line-height:1.25;font-weight:800;color:var(--side-txt)}
.brand h1 span{color:var(--side-acc)}
.brand p{font-size:10.5px;color:var(--side-txt2);letter-spacing:2px;margin-top:5px;font-weight:600}
#nav{flex:1;overflow-y:auto;padding:12px 10px}
.navsec{font-size:10px;letter-spacing:1.6px;color:var(--side-txt2);font-weight:700;margin:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  cursor:pointer;color:var(--side-txt2);font-weight:600;font-size:13.5px;transition:.15s;margin-bottom:2px;
  border:1px solid transparent}
.nav-i:hover{background:var(--side-bg2);color:var(--side-txt)}
.nav-i.on{background:var(--side-bg2);color:#fff;border-color:var(--side-line);
  box-shadow:inset 3px 0 0 var(--side-acc)}
.nav-i .ic{width:18px;text-align:center;font-size:15px;color:var(--side-acc)}
.nav-i .bdg{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;font-weight:800;
  padding:1px 7px;border-radius:20px}
.sidefoot{padding:12px;border-top:1px solid var(--side-line);font-size:10.5px;color:var(--side-txt2);text-align:center}

/* ---------- MAIN ---------- */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#top{height:62px;flex:0 0 62px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.86);
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:0 22px}
#top h2{font-size:17px;font-weight:700}
#top .sub{font-size:11.5px;color:var(--txt3);margin-top:2px}
.topact{margin-left:auto;display:flex;gap:8px;align-items:center}
#view{flex:1;overflow-y:auto;padding:22px}

/* ---------- COMPONENTES ---------- */
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);padding:8px 14px;
  border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;transition:.15s;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:var(--acc)}
.btn.p{background:var(--orange);border:1px solid var(--orange);color:#fff;font-weight:800}
.btn.p:hover{background:var(--orange2);border-color:var(--orange2)}
.btn.d{border-color:#e3b3ac;color:var(--bad);background:#fbeceb}
.btn.d:hover{background:#f7dcd9;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn.gh{background:transparent}
.btn.alerta{background:linear-gradient(180deg,#fdeeec,#fbdcd8);border-color:var(--bad);color:#8a2c25;font-weight:800}
.btn.alerta:hover{background:linear-gradient(180deg,#fbdcd8,#f7c9c3);border-color:#a8332c}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{font-size:13px;font-weight:700;letter-spacing:.3px;margin-bottom:2px}
.card .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.card .ch p{font-size:11px;color:var(--txt3);margin-top:3px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1250px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.g4,.g3,.g2{grid-template-columns:1fr}}

/* KPI tiles */
.kpi{background:linear-gradient(160deg,var(--panel),#f7f8fa);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.kpi.g::after{background:var(--ok)} .kpi.w::after{background:var(--warn)}
.kpi.r::after{background:var(--bad)} .kpi.v::after{background:var(--info)}
.kpi .lb{font-size:10.5px;letter-spacing:1.3px;color:var(--txt3);font-weight:700;text-transform:uppercase}
.kpi .vl{font-size:29px;font-weight:800;margin:7px 0 2px;letter-spacing:-.5px}
.kpi .un{font-size:13px;color:var(--txt2);font-weight:600;margin-left:3px}
.kpi .ft{font-size:11px;color:var(--txt3)}

/* Tabla */
.twrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th{background:var(--bg2);color:var(--txt2);text-align:left;padding:10px 12px;font-size:10.5px;
  letter-spacing:1px;text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--line2);
  position:sticky;top:0;z-index:2}
td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--txt)}
tbody tr:hover{background:#eef3f8}
tbody tr:last-child td{border-bottom:0}
.tnum{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:38px;text-align:center;color:var(--txt3);font-size:13px}

/* Chips / estados */
.tag{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:10.5px;font-weight:700;
  letter-spacing:.4px;border:1px solid transparent}
.t-ok{background:rgba(31,138,76,.10);color:#1f8a4c;border-color:rgba(31,138,76,.35)}
.t-w{background:rgba(184,121,10,.10);color:#a3670a;border-color:rgba(184,121,10,.35)}
.t-r{background:rgba(194,59,59,.10);color:#c23b3b;border-color:rgba(194,59,59,.35)}
.t-b{background:rgba(15,76,129,.10);color:#0f4c81;border-color:rgba(15,76,129,.35)}
.t-v{background:rgba(106,79,176,.10);color:#6a4fb0;border-color:rgba(106,79,176,.35)}
.t-n{background:rgba(87,101,122,.08);color:var(--txt2);border-color:var(--line2)}

/* Filtros */
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,textarea{background:#ffffff;border:1px solid var(--line2);color:var(--txt);
  padding:8px 11px;border-radius:8px;font-size:12.5px;font-family:inherit;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(15,76,129,.14)}
input::placeholder{color:#9aa6b6}
label{display:block;font-size:10.5px;letter-spacing:.9px;color:var(--txt3);font-weight:700;
  margin-bottom:5px;text-transform:uppercase}
.fld{margin-bottom:13px}
.fld input,.fld select,.fld textarea{width:100%}
textarea{resize:vertical;min-height:70px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(18,24,32,.45);backdrop-filter:blur(3px);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.ov.on{display:flex}
.mdl{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:660px;
  box-shadow:0 24px 60px rgba(16,24,40,.20);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(-12px);opacity:0}}
.mdl.wide{max-width:900px}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.mh h3{font-size:15px;font-weight:700}
.mh .x{cursor:pointer;color:var(--txt3);font-size:20px;line-height:1;padding:0 4px}
.mh .x:hover{color:var(--bad)}
.mb{padding:20px 22px;max-height:64vh;overflow-y:auto}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}

/* Barras / progreso */
.pbar{height:7px;background:var(--bg2);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;border-radius:20px;background:var(--accg)}
.pbar i.g{background:linear-gradient(90deg,#16a34a,#1f8a4c)}
.pbar i.w{background:linear-gradient(90deg,#d97706,#a3670a)}
.pbar i.r{background:linear-gradient(90deg,#dc2626,#c23b3b)}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--txt2);margin-top:12px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.hint{font-size:11.5px;color:var(--txt3);line-height:1.6}
.sep{height:1px;background:var(--line);margin:16px 0}
.rowend{display:flex;gap:6px;justify-content:flex-end}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:#c3cbd6;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#a8b3c2}

/* Toast */
#toast{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:9px}
.tst{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--acc);
  padding:12px 18px;border-radius:9px;font-size:12.5px;font-weight:600;box-shadow:var(--sh);animation:pop .2s}
.tst.ok{border-left-color:var(--ok)} .tst.err{border-left-color:var(--bad)}

/* ---------- FOTOS DE LA ORDEN ---------- */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.foto{position:relative;margin:0;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.foto img{width:100%;height:96px;object-fit:cover;display:block;background:var(--bg2)}
.foto figcaption{font-size:10px;color:var(--txt3);padding:5px 7px;line-height:1.35}
.foto .btnx{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
  border:1px solid rgba(194,59,59,.4);background:rgba(255,255,255,.9);color:var(--bad);cursor:pointer;
  font-size:12px;line-height:1;padding:0}
.foto .btnx:hover{background:#fbeceb}
@media print{ .foto .btnx{display:none} .foto img{height:auto;max-height:150px} }

/* ---------- ESTADO DE CONEXIÓN ---------- */
.conex{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:5px 11px;
  border-radius:20px;border:1px solid var(--line2);background:var(--panel2);white-space:nowrap}
.conex .punto{width:8px;height:8px;border-radius:50%;background:var(--txt3)}
.conex .hora{color:var(--txt3);font-weight:600;font-size:10.5px;margin-left:2px}
.conex.c-ok{color:var(--ok);border-color:rgba(31,138,76,.4)}
.conex.c-ok .punto{background:#1f8a4c;box-shadow:0 0 0 3px rgba(31,138,76,.18);animation:lat 2.4s infinite}
.conex.c-w{color:var(--warn);border-color:rgba(184,121,10,.4)} .conex.c-w .punto{background:#b8790a}
.conex.c-r{color:var(--bad);border-color:rgba(194,59,59,.4)} .conex.c-r .punto{background:#c23b3b}
@keyframes lat{0%,100%{opacity:1}50%{opacity:.45}}
.aviso{border-radius:9px;padding:10px 13px;font-size:12.5px;margin-bottom:15px;line-height:1.6}
.aviso.r{background:rgba(194,59,59,.08);border:1px solid rgba(194,59,59,.35);color:#8a2c25}
.aviso.g{background:rgba(31,138,76,.08);border:1px solid rgba(31,138,76,.35);color:#146334}
.cargando{display:flex;gap:8px;justify-content:center;margin-top:22px}
.cargando i{width:11px;height:11px;border-radius:50%;background:var(--acc);animation:sal 1s infinite}
.cargando i:nth-child(2){animation-delay:.15s} .cargando i:nth-child(3){animation-delay:.3s}
@keyframes sal{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-7px)}}

/* ---------- CELULAR ---------- */
#burger{display:none}
@media(max-width:860px){
  body{font-size:15px}
  #burger{display:inline-flex}
  #side{position:fixed;left:0;top:0;bottom:0;z-index:90;transform:translateX(-102%);
    transition:transform .22s ease;box-shadow:14px 0 40px rgba(0,0,0,.25);width:270px;flex-basis:270px}
  #app.menu #side{transform:none}
  #app.menu::after{content:"";position:fixed;inset:0;background:rgba(10,16,24,.4);z-index:80}
  #top{height:auto;flex:0 0 auto;min-height:58px;padding:9px 12px;flex-wrap:wrap;gap:9px}
  #top h2{font-size:15px} #top .sub{display:none}
  .topact{width:100%;order:5;overflow-x:auto;padding-bottom:2px}
  .userchip{padding:4px 6px 4px 9px;font-size:11px}
  .userchip .rol{display:none}
  #view{padding:12px}
  .grid{gap:11px}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr}
  .card{padding:14px}
  .kpi .vl{font-size:23px}
  .bar{gap:7px} .bar input,.bar select{flex:1 1 130px;min-width:0!important;font-size:15px;padding:10px}
  .btn{padding:10px 14px;font-size:14px} .btn.sm{padding:8px 11px;font-size:13px}
  table{font-size:12.5px} td,th{padding:8px 9px}
  .mdl{max-width:100%;border-radius:14px} .mb{max-height:none;padding:16px}
  .ov{padding:12px}
  .mf{flex-wrap:wrap} .mf .btn{flex:1 1 auto;justify-content:center}
  .fld input,.fld select,.fld textarea{font-size:16px;padding:11px}
  .home-body{grid-template-columns:1fr}
  .home-center{order:-1} .home-card{padding:14px;border-radius:18px}
  .hbtn{padding:14px 13px;font-size:14px}
  .rowend{flex-wrap:wrap}
  .conex .hora{display:none}
}
@media(max-width:520px){ .g4,.g3,.g2{grid-template-columns:1fr} }

/* ---------- REJILLA DEL CRONOGRAMA ---------- */
table.crono{font-size:11.5px}
table.crono th.cm{text-align:center;font-size:9.5px;letter-spacing:.6px;border-left:1px solid var(--line2)}
table.crono th.cw{text-align:center;font-size:9px;padding:4px 0;min-width:15px;color:var(--txt3)}
table.crono td{padding:5px 9px;font-size:11.5px}
table.crono tr.grp td{border-top:1px solid var(--line2)}
table.crono td.cc{padding:0;width:15px;min-width:15px;background:var(--bg2);border-left:1px solid var(--line);cursor:pointer}
table.crono td.cc.cb{border-right:1px solid var(--line2)}
table.crono td.cc:hover{outline:1px solid var(--acc);outline-offset:-1px}
table.crono td.cp{background:#2563eb}
table.crono td.cd{background:#bcd4ea;background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(15,76,129,.35) 3px,rgba(15,76,129,.35) 4px)}
table.crono td.ce{background:#22c55e}
table.crono td.cv{background:#c23b3b}
table.crono td.cn{box-shadow:inset 0 0 0 1px #b8790a}
table.crono td.cx{background:#cbd2da;background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(87,101,122,.35) 3px,rgba(87,101,122,.35) 4px)}

/* ---------- ÁRBOL ORGANIGRAMA ---------- */
.orgt,.orgt ul{list-style:none;padding-left:0;margin:0}
.orgt ul{margin-left:26px;border-left:1px solid var(--line2);padding-left:18px}
.orgt li{position:relative;margin:8px 0}
.orgt ul li::before{content:"";position:absolute;left:-18px;top:19px;width:14px;height:1px;background:var(--line2)}
.orgbox{display:inline-flex;align-items:center;gap:11px;background:linear-gradient(160deg,var(--panel),#f4f6f8);
  border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:10px;padding:9px 14px;min-width:250px}
.orgbox .on{font-weight:700;font-size:13px}
.orgbox .op{font-size:11px;color:var(--txt3)}
.orgbox .oa{margin-left:auto;display:flex;gap:5px}
/* ---------- DIAGRAMA DE FLUJO ---------- */
.flowstep{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.flowno{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accg);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px}

/* ---------- ACCESO Y ROLES ---------- */
#app.ro .ed{display:none!important}
.userchip{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line2);
  border-radius:22px;padding:5px 7px 5px 13px;font-size:12px;white-space:nowrap}
.userchip b{font-weight:700}
.userchip .rol{font-size:10px;letter-spacing:.7px;color:var(--txt3);display:block;margin-top:1px}
.userchip .av{width:30px;height:30px;border-radius:50%;background:var(--accg);color:#fff;font-weight:900;
  display:flex;align-items:center;justify-content:center;font-size:12px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px;
  background:radial-gradient(1000px 600px at 50% 20%,rgba(15,76,129,.06),transparent 62%),
             linear-gradient(160deg,#eef1f4,#e4e8ed 55%,#eef1f4)}
.login-card{width:100%;max-width:430px;background:#ffffff;
  border:1px solid var(--line);border-radius:16px;padding:28px 26px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 24px 48px rgba(16,24,40,.10)}
.login-card h1{font-size:19px;font-weight:900;text-align:center;letter-spacing:.6px;color:var(--txt)}
.login-card .sb{text-align:center;font-size:12px;color:var(--txt2);margin:5px 0 20px;font-weight:600}
.pin{letter-spacing:12px;text-align:center;font-size:22px;font-weight:800;padding:11px!important}
.rolebadge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.6px}
.rb-adm{background:rgba(106,79,176,.12);color:#6a4fb0;border:1px solid rgba(106,79,176,.4)}
.rb-pla{background:rgba(15,76,129,.10);color:#0f4c81;border:1px solid rgba(15,76,129,.4)}
.rb-tec{background:rgba(31,138,76,.10);color:#1f8a4c;border:1px solid rgba(31,138,76,.4)}
.rb-are{background:rgba(184,121,10,.10);color:#a3670a;border:1px solid rgba(184,121,10,.4)}
.demolist{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.demolist table{font-size:11.5px}
.demolist td{padding:5px 8px}

/* ---------- PANTALLA PRINCIPAL (PORTADA) ---------- */
#app.home #side,#app.home #top{display:none}
#app.home #view{padding:0;overflow:auto}
.home-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:10px;padding:24px 14px;
  background:
   radial-gradient(1100px 620px at 50% 30%,rgba(15,76,129,.06),transparent 62%),
   radial-gradient(700px 420px at 8% 20%,rgba(217,98,43,.05),transparent 60%),
   radial-gradient(700px 420px at 92% 80%,rgba(15,76,129,.05),transparent 60%),
   linear-gradient(160deg,#eef1f4,#e6e9ed 45%,#eef1f4);position:relative;overflow:hidden}
.home-bg::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(15,76,129,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(15,76,129,.05) 1px,transparent 1px);
  background-size:52px 52px;mask-image:radial-gradient(circle at 50% 50%,#000 35%,transparent 78%)}
.hexcol{display:flex;flex-direction:column;gap:14px;z-index:1}
@media(max-width:1150px){.hexcol{display:none}}
.hex{width:112px;height:126px;display:flex;align-items:center;justify-content:center;position:relative;
  filter:drop-shadow(0 4px 10px rgba(16,24,40,.15))}
.hex svg{position:absolute;inset:0;width:100%;height:100%}
.hex .gl{font-size:34px;color:var(--side-acc);z-index:1}
.home-card{z-index:1;width:100%;max-width:1000px;background:#ffffff;
  border:1px solid var(--line);border-radius:22px;padding:20px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 24px 50px rgba(16,24,40,.10)}
.home-title{background:linear-gradient(180deg,var(--side-bg2),var(--side-bg));border:1px solid var(--side-line);
  border-radius:14px;padding:14px 18px;text-align:center;margin-bottom:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.home-title{display:flex;align-items:center;justify-content:center;gap:16px}
.home-title .logo{height:52px;width:auto;max-width:120px;object-fit:contain;flex:0 0 auto}
.home-title .tt{min-width:0}
.home-title h1{font-size:clamp(19px,3.2vw,33px);font-weight:900;letter-spacing:1.2px;color:#fff}
.home-title p{font-size:clamp(15px,2.4vw,22px);font-weight:800;color:#fff;margin-top:4px;letter-spacing:.6px}
.home-body{display:grid;grid-template-columns:1fr .82fr 1fr;gap:16px;align-items:stretch}
@media(max-width:820px){.home-body{grid-template-columns:1fr}.home-center{order:-1}}
.home-menu{background:linear-gradient(180deg,var(--side-bg2),var(--side-bg));border:1px solid var(--side-line);
  border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.hbtn{position:relative;display:flex;align-items:center;gap:10px;width:100%;cursor:pointer;font-family:inherit;
  border:1px solid var(--side-line);color:var(--side-txt);
  border-radius:11px;padding:11px 13px;font-size:13px;font-weight:700;letter-spacing:.2px;text-align:left;
  transition:.16s;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.hbtn{background:linear-gradient(180deg,var(--side-bg2),var(--side-bg))}
.hbtn:hover{background:linear-gradient(180deg,#274d70,var(--side-bg2));border-color:var(--side-acc);transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(0,0,0,.22)}
.hbtn .hi{width:20px;text-align:center;color:var(--side-acc);font-size:14px;flex:0 0 20px}
.hbtn .hb{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px}
.hbtn .hb.b{background:#0e7490;color:#e0f7ff}
.home-center{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.home-center .emb{width:100%;max-width:230px}
.yearbox{background:linear-gradient(180deg,var(--side-bg2),var(--side-bg));border:1px solid var(--side-line);border-radius:10px;
  padding:5px 22px;font-size:24px;font-weight:900;color:#fff;letter-spacing:2px}
.home-foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.homelink{display:block;text-align:center;font-size:11px;color:var(--txt3);margin-top:14px;letter-spacing:.6px}

/* ---------- ÁRBOL ORGANIGRAMA (dup. histórica) ---------- */
@media print{
  #side,#top .topact,.noprint{display:none!important}
  body,#view{overflow:visible;height:auto}
  #app{display:block}
}

async function cargarTodo(){
  const r={};
  await Promise.all(TABLAS.map(async t=>{
    let desde=0, todo=[];
    for(;;){ const {data,error}=await SB.from(t).select('id,data').range(desde,desde+999);
      if(error) throw new Error(t+': '+error.message);
      todo=todo.concat(data||[]); if(!data||data.length<1000) break; desde+=1000; }
    r[t]=todo.map(x=>Object.assign({},x.data,{id:x.id}));
  }));
  const {data:cf}=await SB.from('config').select('data').eq('id',EMPRESA).maybeSingle();
  const base=vacio();
  // sólo los registros de la empresa activa; los antiguos sin marcar se adoptan aquí
  TABLAS.forEach(t=>base[COL[t]] = (t==='empresas'||t==='usuarios') ? r[t]
    : r[t].filter(o=>!o.empresa || o.empresa===EMPRESA));
  if(cf&&cf.data){ const c=cf.data;
    base.areas=c.areas||[]; base.tecnicos=c.tecnicos||[]; base.politica=c.politica||'';
    base.config={empresa:c.empresa||'',area:c.area||'',responsable:c.responsable||'',
      horasTurno:c.horasTurno||16,diasMes:c.diasMes||26,moneda:c.moneda||'MXN',anio:c.anio||new Date().getFullYear(),
      inicioKPI:c.inicioKPI||'2026-09-01'};
  }
  DB=base; tomarFoto(); cache();
  ESTADO.red='en linea'; ESTADO.ultima=new Date(); ESTADO.error='';
}

async function sincronizar(){
  if(!SB||!SESION) return;
  // todo lo que se guarde queda marcado con la empresa activa
  if(EMPRESA) TABLAS.forEach(t=>{ if(t==='empresas'||t==='usuarios') return;
    (DB[COL[t]]||[]).forEach(o=>{ if(o&&o.id&&!o.empresa) o.empresa=EMPRESA; }); });
  const subir=[], borrar=[];
  TABLAS.forEach(t=>{
    const vivos={};
    (DB[COL[t]]||[]).forEach(o=>{ if(!o||!o.id) return; vivos[o.id]=true;
      const s=JSON.stringify(o); if(SNAP[t][o.id]!==s) subir.push({t,o,s}); });
    Object.keys(SNAP[t]||{}).forEach(id=>{ if(!vivos[id]) borrar.push({t,id}); });
  });
  const cfg=objConfig(), cfgS=JSON.stringify(cfg);
  const cambioCfg=SNAP.__config!==cfgS;
  if(!subir.length&&!borrar.length&&!cambioCfg){ return; }
  ESTADO.pend=subir.length+borrar.length+(cambioCfg?1:0); pintarEstado();
  const rechazadas=[]; let fallo='';
  try{
    const porTabla={};
    subir.forEach(x=>{ (porTabla[x.t]=porTabla[x.t]||[]).push(x); });
    for(const t of Object.keys(porTabla)){
      const lote=porTabla[t];
      for(let i=0;i<lote.length;i+=400){
        const trozo=lote.slice(i,i+400);
        const {error}=await SB.from(t).upsert(trozo.map(x=>
          ({id:x.o.id,data:x.o,actualizado:new Date().toISOString(),actualizado_por:SESION.nombre})));
        if(error){
          // el resto de las tablas debe seguir enviándose: sólo se aparta lo rechazado
          fallo=fallo||error.message; trozo.forEach(x=>rechazadas.push(x));
        } else trozo.forEach(x=>SNAP[x.t][x.o.id]=x.s);
      }
    }
    for(const b of borrar){ const {error}=await SB.from(b.t).delete().eq('id',b.id);
      if(error){ fallo=fallo||error.message; } else delete SNAP[b.t][b.id]; }
    if(cambioCfg){ const {error}=await SB.from('config').upsert(
        {id:EMPRESA,data:cfg,actualizado:new Date().toISOString(),actualizado_por:SESION.nombre});
      if(error) fallo=fallo||error.message; else SNAP.__config=cfgS; }
  }catch(e){ fallo=fallo||e.message; }
  if(rechazadas.length) await devolverRechazadas(rechazadas);
  if(fallo){
    const tablas=[...new Set(rechazadas.map(x=>x.t))].join(', ');
    ESTADO.red='error'; ESTADO.error=fallo; ESTADO.pend=0;
    toast(/permission|policy|row-level/i.test(fallo)
      ? 'Tu rol no tiene permiso para guardar ese dato'+(tablas?' (tabla: '+tablas+')':'')+' · el resto sí se guardó · '+fallo
      : 'No se pudo guardar: '+fallo,'err');
  } else { ESTADO.red='en linea'; ESTADO.ultima=new Date(); ESTADO.pend=0; ESTADO.error=''; }
  pintarEstado();
}

/* Restaura desde el servidor lo que fue rechazado, para no quedar desincronizado */
async function devolverRechazadas(lista){
  const porTabla={};
  lista.forEach(x=>{ (porTabla[x.t]=porTabla[x.t]||[]).push(x.o.id); });
  for(const t of Object.keys(porTabla)){
    for(const id of porTabla[t]){
      try{
        const {data}=await SB.from(t).select('id,data').eq('id',id).maybeSingle();
        const col=COL[t], arr=DB[col]||[];
        const i=arr.findIndex(o=>o.id===id);
        if(data&&data.data){ const o=Object.assign({},data.data,{id:data.id});
          if(i>=0) arr[i]=o; else arr.push(o);
          SNAP[t][id]=JSON.stringify(o);
        } else if(i>=0){ DB[col]=arr.filter(o=>o.id!==id); delete SNAP[t][id]; }
      }catch(e){}
    }
  }
  cache();
}

/* ---------- tiempo real: lo que hacen los demás llega solo ---------- */
let REDIB=null;
function suscribir(){
  if(CANAL) { try{ SB.removeChannel(CANAL); }catch(e){} }
  CANAL=SB.channel('stm-vivo');
  TABLAS.concat(['config']).forEach(t=>{
    CANAL.on('postgres_changes',{event:'*',schema:'public',table:t},p=>aplicarRemoto(t,p));
  });
  CANAL.subscribe(st=>{
    if(st==='SUBSCRIBED'){ ESTADO.red='en linea'; ESTADO.error=''; }
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ ESTADO.red='sin conexion'; }
    pintarEstado();
  });
}
function visiblePara(t,o){
  if(!SESION||!o) return false;
  if(t!=='empresas'&&t!=='usuarios'&&o.empresa&&EMPRESA&&o.empresa!==EMPRESA) return false;
  if(t==='ots'){
    if(esTec())  return o.tecnico===SESION.nombre;
    if(esArea()) return o.areaSolicitante===SESION.area;
  }
  if(t==='presupuesto') return esAdmin()||esPlan();
  return true;
}
function aplicarRemoto(t,p){
  try{
    if(t==='config'){
      if(p.new&&p.new.id&&EMPRESA&&p.new.id!==EMPRESA) return;
      const c=(p.new&&p.new.data)||{}; if(!c||!Object.keys(c).length) return;
      DB.areas=c.areas||DB.areas; DB.tecnicos=c.tecnicos||DB.tecnicos; DB.politica=c.politica||DB.politica;
      DB.config=Object.assign({},DB.config,{empresa:c.empresa,area:c.area,responsable:c.responsable,
        horasTurno:c.horasTurno,diasMes:c.diasMes,moneda:c.moneda,anio:c.anio,inicioKPI:c.inicioKPI||'2026-09-01'});
      SNAP.__config=JSON.stringify(objConfig());
    } else {
      const col=COL[t], arr=DB[col]; if(!arr) return;
      if(p.eventType==='DELETE'){
        const id=(p.old&&p.old.id); if(!id) return;
        DB[col]=arr.filter(x=>x.id!==id); delete SNAP[t][id];
      } else {
        const o=p.new&&p.new.data?Object.assign({},p.new.data,{id:p.new.id||p.new.data.id}):null;
        if(!o||!o.id) return;
        const i=arr.findIndex(x=>x.id===o.id);
        if(!visiblePara(t,o)){          // dejó de corresponderme: lo suelto
          if(i>=0) DB[col]=arr.filter(x=>x.id!==o.id);
          delete SNAP[t][o.id];
        } else {
          if(i>=0) arr[i]=o; else arr.push(o);
          SNAP[t][o.id]=JSON.stringify(o);
        }
      }
    }
    ESTADO.ultima=new Date(); cache();
    clearTimeout(REDIB); REDIB=setTimeout(()=>{ if(SESION&&!document.getElementById('ov').classList.contains('on')) render(); },350);
  }catch(e){}
}
function pintarEstado(){
  const e=document.getElementById('conex'); if(!e) return;
  const m={'en linea':['ok','En línea'],'conectando':['w','Conectando…'],'sin conexion':['r','Sin conexión'],'error':['r','Error']}[ESTADO.red]||['n','—'];
  e.className='conex c-'+m[0];
  e.innerHTML=`<span class="punto"></span>${m[1]}${ESTADO.pend?' · '+ESTADO.pend+' por enviar':''}`+
    (ESTADO.ultima?`<span class="hora">${ESTADO.ultima.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>`:'');
  e.title=ESTADO.error||('Última sincronización: '+(ESTADO.ultima?ESTADO.ultima.toLocaleString('es-MX'):'—'));
}

/* =========================================================
   MOTOR DE INDICADORES (KPI)
   ========================================================= */
let RANGO={desde:addDays(today(),-90),hasta:today(),area:'',activo:''};

function otsEnRango(r=RANGO){
  return DB.ots.filter(o=>{
    if(o.fecha<r.desde||o.fecha>r.hasta) return false;
    if(o.estado==='Cancelada') return false;
    const a=DB.activos.find(x=>x.id===o.activo);
    if(r.area && (!a||a.area!==r.area)) return false;
    if(r.activo && o.activo!==r.activo) return false;
    return true;
  });
}
function activosEnRango(r=RANGO){
  return DB.activos.filter(a=>a.estado!=='De baja' && (!r.area||a.area===r.area) && (!r.activo||a.id===r.activo));
}

/* Fecha desde la que se empiezan a contar los indicadores de confiabilidad.
   Antes de esa fecha no hay historia válida, así que ni las horas operativas
   ni las fallas entran en MTTF, MTBF, MDT ni disponibilidad. */
const INICIO_KPI_POR_DEFECTO='2026-09-01';
function inicioKPI(){ return (DB.config&&DB.config.inicioKPI)||INICIO_KPI_POR_DEFECTO; }
/* Recorta un periodo para que no empiece antes del inicio de conteo
   ni termine después de hoy: en el futuro no hay horas trabajadas que medir. */
function rangoConfiable(r=RANGO){
  const ini=inicioKPI(), hoy=today();
  let desde=r.desde, hasta=r.hasta, recortado=false;
  if(ini && desde<ini){ desde=ini; recortado=true; }
  if(hasta>hoy){ hasta=hoy; recortado=true; }
  if(desde>hasta) return {r:Object.assign({},r,{desde,hasta:desde}),recortado:true,vacio:true};
  return {r:Object.assign({},r,{desde,hasta}),recortado,vacio:false};
}
function kpis(r=RANGO){
  const c=rangoConfiable(r);
  const vacio=c.vacio; r=c.r;
  const ots=vacio?[]:otsEnRango(r), act=activosEnRango(r);
  const dias=vacio?0:Math.max(1,daysBetween(r.desde,r.hasta)+1);
  const hDia=Number(DB.config.horasTurno)||16;
  const tProgramado=dias*hDia*Math.max(1,act.length);      // horas-equipo programadas
  const fallas=ots.filter(o=>o.tipo==='Correctivo'&&o.falla);
  const n=fallas.length;
  const tParo=fallas.reduce((s,o)=>s+(Number(o.hParo)||0),0);
  const tRep=fallas.reduce((s,o)=>s+(Number(o.hReparacion)||0),0);
  const tOperativo=Math.max(0,tProgramado-tParo);

  const MTTR = n? tRep/n : 0;                       // tiempo medio de reparación (mano de obra)
  const MDT  = n? tParo/n : 0;                      // tiempo medio de indisponibilidad (paro)
  const MTTF = n? tOperativo/n : tOperativo;        // tiempo medio operativo hasta la falla
  const MTBF = n? MTTF+MDT : tOperativo;            // tiempo medio entre fallas (ciclo completo)
  const DISP = tProgramado? (tOperativo/tProgramado)*100 : 100;   // = MTTF / MTBF

  const pm=ots.filter(o=>o.tipo==='Preventivo');
  const pmCerr=pm.filter(o=>o.estado==='Cerrada').length;
  const cumplPM = pm.length? (pmCerr/pm.length)*100 : 0;
  const cerradas=ots.filter(o=>o.estado==='Cerrada');
  const cumplOT = ots.length? (cerradas.length/ots.length)*100 : 0;
  const abiertas=ots.filter(o=>['Abierta','En proceso','En espera repuesto'].includes(o.estado));
  const costoMO=ots.reduce((s,o)=>s+(Number(o.costoMO)||0),0);
  const costoMat=ots.reduce((s,o)=>s+(Number(o.costoMat)||0),0);
  const costo=costoMO+costoMat;
  const hCorr=fallas.reduce((s,o)=>s+(Number(o.hReparacion)||0),0);
  const hPrev=pm.reduce((s,o)=>s+(Number(o.hReparacion)||0),0);
  const ratioPrev = (hCorr+hPrev)? (hPrev/(hCorr+hPrev))*100 : 0;
  const tiempoMedioCierre = (()=>{ const c=cerradas.filter(o=>o.fechaCierre);
     return c.length? c.reduce((s,o)=>s+Math.max(0,daysBetween(o.fecha,o.fechaCierre)),0)/c.length : 0; })();

  return{ots,act,dias,tProgramado,tOperativo,tParo,tRep,fallas:n,MTTR,MDT,MTTF,MTBF,
    DISP:vacio?0:DISP,
    cumplPM,cumplOT,abiertas:abiertas.length,total:ots.length,cerradas:cerradas.length,
    costo,costoMO,costoMat,ratioPrev,tiempoMedioCierre,pmTot:pm.length,pmCerr,
    desde:r.desde,hasta:r.hasta,recortado:c.recortado,sinHistoria:vacio,inicio:inicioKPI()};
}

/* Estado de un plan preventivo */
function estadoPlan(p){
  const a=DB.activos.find(x=>x.id===p.activo);
  if(p.base==='Frecuencia (días)' && !p.ultima){
    const n=proximaSemana(p);
    return{prox:n?n.txt:'—',restante:n?n.dias:0,unidad:'días',pct:0,
      estado:(n&&n.dias<0)?'Vencido':'Sin registrar'};
  }
  if(p.base==='Frecuencia (días)'){
    const prox=addDays(p.ultima,Number(p.intervalo)||30);
    const d=daysBetween(today(),prox);
    return{prox,restante:d,unidad:'días',
      pct:Math.min(100,Math.max(0,100-(d/(Number(p.intervalo)||30))*100)),
      estado:d<0?'Vencido':(d<=Math.max(3,(Number(p.intervalo)||30)*0.15)?'Por vencer':'Programado')};
  }
  const lect=a?lecturaActual(a).lectura:0;   // incluye la lectura cargada en el check list
  const prox=(Number(p.lecturaUlt)||0)+(Number(p.intervalo)||1);
  const rest=prox-lect;
  const un=p.base==='Odómetro (km)'?'km':'h';
  return{prox:num(prox,0)+' '+un,restante:rest,unidad:un,
    pct:Math.min(100,Math.max(0,100-(rest/(Number(p.intervalo)||1))*100)),
    estado:rest<0?'Vencido':(rest<=(Number(p.intervalo)||1)*0.15?'Por vencer':'Programado')};
}

const PAL=['#0f4c81','#3b82f6','#6a4fb0','#f59e0b','#22c55e','#ef4444','#14b8a6','#e879f9','#94a3b8','#fb923c'];

function svgBar(data,{h=210,fmt=v=>num(v,0),color=null,horizontal=false}={}){
  if(!data.length) return '<div class="empty">Sin datos en el periodo</div>';
  const max=Math.max(...data.map(d=>d.value),1);
  if(horizontal){
    const rowH=26, H=data.length*rowH+10;
    return `<svg viewBox="0 0 600 ${H}" style="width:100%;height:${H}px">`+data.map((d,i)=>{
      const w=(d.value/max)*380, y=i*rowH+4;
      return `<text x="0" y="${y+13}" fill="#57657a" font-size="11">${esc(d.label).slice(0,26)}</text>
      <rect x="178" y="${y+3}" width="${w}" height="14" rx="4" fill="${d.color||color||PAL[i%PAL.length]}" opacity=".9"/>
      <text x="${182+w}" y="${y+14}" fill="#182430" font-size="11" font-weight="700">${fmt(d.value)}</text>`;
    }).join('')+'</svg>';
  }
  const W=600,pad=30,bw=(W-pad*2)/data.length;
  /* Ancho de la etiqueta según el espacio real de cada barra, para no cortar
     nombres cortos (p.ej. "Producción") ni encimar textos cuando hay muchas barras. */
  const maxChars=Math.max(4,Math.floor((bw*.92)/5.3));
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px">
    ${[0,.25,.5,.75,1].map(f=>`<line x1="${pad}" x2="${W-10}" y1="${20+(h-55)*(1-f)}" y2="${20+(h-55)*(1-f)}" stroke="#e3e7ec"/>
      <text x="0" y="${24+(h-55)*(1-f)}" fill="#8592a3" font-size="9">${fmt(max*f)}</text>`).join('')}
    ${data.map((d,i)=>{const bh=(d.value/max)*(h-55),x=pad+i*bw+bw*.18,y=20+(h-55)-bh;
      const lbl=esc(d.label),lblShort=lbl.length>maxChars?lbl.slice(0,maxChars-1)+'…':lbl;
      return `<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(0,bh)}" rx="3" fill="${d.color||color||PAL[i%PAL.length]}" opacity=".92"><title>${lbl}: ${fmt(d.value)}</title></rect>
      <text x="${x+bw*.32}" y="${h-22}" fill="#57657a" font-size="9.5" text-anchor="middle">${lblShort}</text>
      <text x="${x+bw*.32}" y="${y-4}" fill="#182430" font-size="9" text-anchor="middle" font-weight="700">${d.value?fmt(d.value):''}</text>`}).join('')}
  </svg>`;
}

function svgGrouped(labels,series,{h=230,fmt=v=>num(v/1000,0)+'k'}={}){
  const max=Math.max(...series.flatMap(s=>s.data),1),W=620,pad=36,gw=(W-pad-14)/labels.length;
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px">
   ${[0,.5,1].map(f=>`<line x1="${pad}" x2="${W-8}" y1="${18+(h-52)*(1-f)}" y2="${18+(h-52)*(1-f)}" stroke="#e3e7ec"/>
     <text x="0" y="${22+(h-52)*(1-f)}" fill="#8592a3" font-size="9">${fmt(max*f)}</text>`).join('')}
   ${labels.map((l,i)=>series.map((s,j)=>{
      const bw=gw*.7/series.length, bh=(s.data[i]/max)*(h-52),
            x=pad+i*gw+gw*.15+j*bw, y=18+(h-52)-bh;
      return `<rect x="${x}" y="${y}" width="${bw*.86}" height="${Math.max(0,bh)}" rx="2" fill="${s.color}"><title>${esc(l)} · ${esc(s.name)}: ${fmt(s.data[i])}</title></rect>`;
   }).join('')+`<text x="${pad+i*gw+gw*.5}" y="${h-20}" fill="#57657a" font-size="9.5" text-anchor="middle">${esc(l)}</text>`).join('')}
  </svg>`;
}

function svgLine(labels,values,{h=200,color='#0f4c81',fmt=v=>num(v,1)}={}){
  if(!values.length) return '<div class="empty">Sin datos</div>';
  const max=Math.max(...values,1)*1.15,W=620,pad=34,step=(W-pad-14)/Math.max(1,labels.length-1);
  const pts=values.map((v,i)=>[pad+i*step,18+(h-50)*(1-v/max)]);
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:${h}px">
   ${[0,.5,1].map(f=>`<line x1="${pad}" x2="${W-8}" y1="${18+(h-50)*(1-f)}" y2="${18+(h-50)*(1-f)}" stroke="#e3e7ec"/>
     <text x="0" y="${22+(h-50)*(1-f)}" fill="#8592a3" font-size="9">${fmt(max*f)}</text>`).join('')}
   <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/>
   <polygon points="${pad},${18+(h-50)} ${pts.map(p=>p.join(',')).join(' ')} ${pad+(labels.length-1)*step},${18+(h-50)}" fill="${color}" opacity=".10"/>
   ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#ffffff" stroke="${color}" stroke-width="2"><title>${esc(labels[i])}: ${fmt(values[i])}</title></circle>`).join('')}
   ${labels.map((l,i)=>`<text x="${pad+i*step}" y="${h-18}" fill="#57657a" font-size="9.5" text-anchor="middle">${esc(l)}</text>`).join('')}
  </svg>`;
}

function svgGauge(pct,label,{color=null}={}){
  const p=Math.max(0,Math.min(100,pct)), c=color||(p>=90?'#22c55e':p>=75?'#f59e0b':'#ef4444');
  const r=62, circ=Math.PI*r, off=circ*(1-p/100);
  return `<svg viewBox="0 0 150 92" style="width:100%;max-width:190px;height:auto">
    <path d="M13 78 A ${r} ${r} 0 0 1 137 78" fill="none" stroke="#e4e8ec" stroke-width="14" stroke-linecap="round"/>
    <path d="M13 78 A ${r} ${r} 0 0 1 137 78" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
    <text x="75" y="70" text-anchor="middle" fill="#182430" font-size="25" font-weight="800">${num(p,1)}%</text>
    <text x="75" y="88" text-anchor="middle" fill="#8592a3" font-size="9.5" letter-spacing="1">${esc(label)}</text>
  </svg>`;
}

function svgDonut(data,{size=170}={}){
  const tot=data.reduce((s,d)=>s+d.value,0)||1; let acc=0; const R=70,r=44;
  const arcs=data.map((d,i)=>{
    const a0=acc/tot*2*Math.PI-Math.PI/2; acc+=d.value; const a1=acc/tot*2*Math.PI-Math.PI/2;
    const big=(a1-a0)>Math.PI?1:0;
    const p=(rad,a)=>[90+rad*Math.cos(a),90+rad*Math.sin(a)];
    const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);
    return `<path d="M${x0} ${y0} A${R} ${R} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${big} 0 ${x3} ${y3} Z"
      fill="${d.color||PAL[i%PAL.length]}" opacity=".92"><title>${esc(d.label)}: ${num(d.value,0)} (${num(d.value/tot*100,1)}%)</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 180 180" style="width:${size}px;height:${size}px">${arcs}
    <text x="90" y="86" text-anchor="middle" fill="#182430" font-size="24" font-weight="800">${num(tot,0)}</text>
    <text x="90" y="103" text-anchor="middle" fill="#8592a3" font-size="9.5" letter-spacing="1">TOTAL</text></svg>`;
}
function legend(data){return '<div class="legend">'+data.map((d,i)=>`<span><i style="background:${d.color||PAL[i%PAL.length]}"></i>${esc(d.label)}</span>`).join('')+'</div>';}

    return `<div class="nav-i ${VISTA===m.id?'on':''}" onclick="ir('${js(m.id)}')"><span class="ic">${m.ic}</span>${m.t}${b}</div>`;
  }).join('');

/* =========================================================
   GENERADOR DE EXCEL (.xlsx) CON GRÁFICOS NATIVOS
   Sin librerías externas: arma el paquete OOXML y lo comprime
   en un ZIP "almacenado" (sin compresión), que Excel acepta.
   ========================================================= */

/* ---- CRC32 para el ZIP ---- */
const CRC_TABLA=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}
  return t;})();
function crc32(bytes){let c=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c=CRC_TABLA[(c^bytes[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;}

function utf8(s){ return new TextEncoder().encode(s); }

/* ---- ZIP mínimo, método 0 (store) ---- */
function zip(archivos){
  const partes=[], central=[];
  let offset=0;
  const dv=n=>{const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,n,true);return b;};
  const dv2=n=>{const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,n,true);return b;};
  archivos.forEach(f=>{
    const nombre=utf8(f.nombre), datos=f.datos, crc=crc32(datos);
    const local=[utf8('PK\x03\x04'),dv2(20),dv2(0x0800),dv2(0),dv2(0),dv2(0),
      dv(crc),dv(datos.length),dv(datos.length),dv2(nombre.length),dv2(0),nombre];
    local.forEach(p=>partes.push(p)); partes.push(datos);
    const tamLocal=30+nombre.length+datos.length;
    central.push([utf8('PK\x01\x02'),dv2(20),dv2(20),dv2(0x0800),dv2(0),dv2(0),dv2(0),
      dv(crc),dv(datos.length),dv(datos.length),dv2(nombre.length),dv2(0),dv2(0),dv2(0),dv2(0),dv(0),dv(offset),nombre]);
    offset+=tamLocal;
  });
  const inicioCentral=offset;
  let tamCentral=0;
  central.forEach(c=>{ c.forEach(p=>partes.push(p)); tamCentral+=46+c[c.length-1].length; });
  [utf8('PK\x05\x06'),dv2(0),dv2(0),dv2(archivos.length),dv2(archivos.length),
   dv(tamCentral),dv(inicioCentral),dv2(0)].forEach(p=>partes.push(p));
  let total=0; partes.forEach(p=>total+=p.length);
  const salida=new Uint8Array(total); let pos=0;
  partes.forEach(p=>{salida.set(p,pos);pos+=p.length;});
  return salida;
}

/* ---- utilidades de hoja ---- */
const xeXL=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colXL(n){ let s=''; n++; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }

/* filas: array de arrays. Cada celda: número, texto, o {v,s} con estilo */
function hojaXML(filas,anchos){
  let sd='';
  if(anchos&&anchos.length) sd='<cols>'+anchos.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
  const cuerpo=filas.map((fila,r)=>{
    const celdas=fila.map((c,i)=>{
      if(c==null||c==='') return '';
      const est=(c&&typeof c==='object'&&'s' in c)?c.s:0;
      const v=(c&&typeof c==='object')?c.v:c;
      const ref=colXL(i)+(r+1);
      const sAttr=est?` s="${est}"`:'';
      if(typeof v==='number'&&isFinite(v)) return `<c r="${ref}"${sAttr}><v>${v}</v></c>`;
      return `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${xeXL(v)}</t></is></c>`;
    }).join('');
    return `<row r="${r+1}">${celdas}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">${sd}<sheetData>${cuerpo}</sheetData></worksheet>`;
}
function hojaConDibujo(filas,anchos,rid){
  return hojaXML(filas,anchos).replace('</worksheet>',`<drawing r:id="${rid}"/></worksheet>`);
}

/* ---- ensamblado del libro ----
   hojas: [{nombre, filas, anchos, graficos?}]
*/
function construirXlsx(hojas){
  const archivos=[];
  const add=(nombre,txt)=>archivos.push({nombre,datos:utf8(txt)});

  let nChart=0;
  const overrides=[];
  hojas.forEach((h,i)=>{
    const n=i+1;
    if(h.graficos&&h.graficos.length){
      const ids=[];
      h.graficos.forEach(g=>{ nChart++; ids.push(nChart);
        add(`xl/charts/chart${nChart}.xml`,graficoXML(g.titulo,g.tipo,g.hoja,g.catCol,g.filaIni,g.filaFin,g.series));
        overrides.push(`<Override PartName="/xl/charts/chart${nChart}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>`);
      });
      const nd=n;
      add(`xl/drawings/drawing${nd}.xml`,dibujoXML(h.graficos));
      add(`xl/drawings/_rels/drawing${nd}.xml.rels`,
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${
          ids.map((id,k)=>`<Relationship Id="rId${k+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${id}.xml"/>`).join('')}</Relationships>`);
      add(`xl/worksheets/_rels/sheet${n}.xml.rels`,
        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdD1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${nd}.xml"/></Relationships>`);
      add(`xl/worksheets/sheet${n}.xml`,hojaConDibujo(h.filas,h.anchos,'rIdD1'));
      overrides.push(`<Override PartName="/xl/drawings/drawing${nd}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);
    } else {
      add(`xl/worksheets/sheet${n}.xml`,hojaXML(h.filas,h.anchos));
    }
    overrides.push(`<Override PartName="/xl/worksheets/sheet${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
  });

  add('xl/styles.xml',ESTILOS);
  add('xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${hojas.map((h,i)=>`<sheet name="${xeXL(h.nombre)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`);
  add('xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${
   hojas.map((h,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
<Relationship Id="rId${hojas.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  add('_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

function bajarBinario(nombre,bytes,tipo){
  const b=new Blob([bytes],{type:tipo||'application/octet-stream'}),u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=nombre; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
  toast('Archivo generado: '+nombre);
}

function acts(html){ document.getElementById('tActs').innerHTML=html; }
/* Repinta la vista conservando el foco y el cursor del campo que se está escribiendo.
   Sin esto, cada tecla en un buscador destruye el input y hay que volver a hacer clic. */
function set(html){
  const v=document.getElementById('view');
  const a=document.activeElement;
  let foco=null;
  if(a&&a.id&&v&&v.contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')){
    foco={id:a.id,ini:a.selectionStart,fin:a.selectionEnd};
  }
  v.innerHTML=html;
  if(foco){
    const n=document.getElementById(foco.id);
    if(n){
      n.focus();
      try{ if(foco.ini!=null) n.setSelectionRange(foco.ini,foco.fin); }catch(e){}
    }
  }
}
/* Buscador reutilizable: id estable para que set() pueda devolverle el foco */
function campoBuscar(id,valor,alEscribir,ph,ancho){
  return `<input id="${id}" placeholder="${esc(ph||'Buscar…')}" style="min-width:${ancho||250}px" autocomplete="off"
    value="${esc(valor||'')}" oninput="${alEscribir}">`;
}

function serieMensual(){
  const y=DB.config.anio, corr=Array(12).fill(0), prev=Array(12).fill(0);
  DB.ots.forEach(o=>{ if(o.estado==='Cancelada')return;
    const d=new Date(o.fecha+'T00:00:00'); if(d.getFullYear()!==y) return;
    const c=(Number(o.costoMO)||0)+(Number(o.costoMat)||0);
    if(o.tipo==='Correctivo') corr[d.getMonth()]+=c; else prev[d.getMonth()]+=c; });
  return{labels:MESES,corr,prev};
}

    F.row(F.numf('Horas de paro del equipo','hParo',o.hParo,'0.1'),F.numf('Horas de reparación (mano de obra)','hReparacion',o.hReparacion,'0.1'))+
    F.row(F.numf('Costo mano de obra','costoMO',o.costoMO),F.numf('Costo de materiales / repuestos','costoMat',o.costoMat))+

    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn p" onclick="okOT('${js(id||'')}')">Guardar OT</button>`);
}
function siguienteOT(){
  const n=DB.ots.map(o=>parseInt(String(o.id).replace(/\D/g,''))||0);
  return 'OT-'+String((n.length?Math.max(...n):0)+1).padStart(4,'0');
}
function okOT(id){
  const prev=DB.ots.find(x=>x.id===id)||{};
  const o={id:val('id').toUpperCase(),activo:val('activo'),tipo:val('tipo'),prioridad:val('prioridad'),
    descripcion:val('descripcion'),estado:val('estado'),fecha:val('fecha'),fechaCierre:val('fechaCierre'),
    tecnico:val('tecnico'),hParo:valn('hParo'),hReparacion:valn('hReparacion'),costoMO:valn('costoMO'),
    costoMat:valn('costoMat'),falla:val('falla')==='1',notas:val('notas'),
    categoria:val('categoria')||prev.categoria||'',contacto:prev.contacto||'',
    plan:prev.plan||'',
    fotos:prev.fotos||[],
    solicitante:prev.solicitante||(SESION?SESION.nombre:''),
    areaSolicitante:prev.areaSolicitante||'',
    horaInicio:prev.horaInicio||'',horaFin:prev.horaFin||'',impacto:prev.impacto||'Sin afectación',
    ejecutor:prev.ejecutor||'',aprobadaPor:prev.aprobadaPor||'',fechaAprobacion:prev.fechaAprobacion||''};
  if(!o.id||!o.descripcion) return toast('N.º de OT y descripción son obligatorios','err');
  if(!id&&DB.ots.some(x=>x.id===o.id)) return toast('Ese número de OT ya existe','err');
  if(o.estado==='Cerrada'){
    if(!o.fechaCierre) o.fechaCierre=today();
    if(!o.aprobadaPor){ o.aprobadaPor=SESION?SESION.nombre:''; o.fechaAprobacion=o.fechaAprobacion||today(); }
  }
  const esNueva=!id;
  if(id){ const i=DB.ots.findIndex(x=>x.id===id); DB.ots[i]=o; } else DB.ots.push(o);
  save('Orden de trabajo guardada');
  if(esNueva) formFotosOT(o.id);
}

let fPl={area:'',activo:'',frec:'',tipo:'',estado:'',q:'',pendAnio:false,mes:''};
/* Selección para generar OTs preventivas de forma masiva (ej. todas las de un mes).
   Se guarda por id de plan, independiente de los filtros activos en pantalla. */
let PM_SEL={};
function vencidasPlan(){ return DB.planes.filter(p=>estadoPlan(p).estado==='Vencido'); }
function soloVencidas(){ fPl={area:'',activo:'',frec:'',tipo:'',estado:'Vencido',q:'',pendAnio:false,mes:''}; VISTA='pm'; render(); }
function pmToggle(id,on){ if(on) PM_SEL[id]=true; else delete PM_SEL[id]; vPM(); }
function pmToggleAll(on,ids){ (ids||[]).forEach(id=>{ if(on) PM_SEL[id]=true; else delete PM_SEL[id]; }); vPM(); }
function pmSeleccionadas(){ return DB.planes.map(p=>p.id).filter(id=>PM_SEL[id]); }
/* ids de las filas visibles según los filtros actuales. Se le puede pasar el arreglo
   ya calculado (durante el render) o llamar sin argumentos (desde un onclick) y
   recalcula con planesFiltrados(). */
function idsVisiblesPM(datos){ return (datos||planesFiltrados()).map(x=>x.p.id); }
/* Filtro de la tabla de planes preventivos, reutilizable: lo usa vPM() para
   pintar la tabla y generarOTsDeFiltro() para saber, en el momento del clic,
   exactamente qué actividades están visibles según fPl (sin depender de un
   arreglo capturado en el render anterior). */
function planesFiltrados(){
  const AN=anioCrono(), acAN=semActualDe(AN);
  return DB.planes.map(p=>({p,e:estadoPlan(p)})).filter(x=>{
      const a=DB.activos.find(y=>y.id===x.p.activo)||{};
      if(fPl.area&&a.area!==fPl.area) return false;
      if(fPl.activo&&x.p.activo!==fPl.activo) return false;
      if(fPl.frec&&(x.p.frec||'')!==fPl.frec) return false;
      if(fPl.tipo&&(x.p.tipoMtto||'Preventivo')!==fPl.tipo) return false;
      if(fPl.estado&&x.e.estado!==fPl.estado) return false;
      if(fPl.q&&!((x.p.activo+' '+x.p.nombre+' '+(a.nombre||'')).toLowerCase().includes(fPl.q.toLowerCase()))) return false;
      if(fPl.mes!==''&&!(x.p.semanas||[]).some(w=>Math.floor(w/4)===Number(fPl.mes))) return false;
      if(fPl.pendAnio){
        const ej=ejecSem(x.p,AN), na=noApSem(x.p,AN);
        if(!(x.p.semanas||[]).some(w=>w<acAN && !ej.includes(w) && !na.includes(w))) return false;
      }
      return true;
    }).sort((a,b)=>a.e.restante-b.e.restante);
}
function generarOTsDeFiltro(){ generarOTsMasivo(planesFiltrados().map(x=>x.p.id),etiquetaFiltroPM()); }
function etiquetaFiltroPM(){
  if(fPl.mes!=='') return MESES[Number(fPl.mes)];
  const m={'Vencido':'las vencidas','Por vencer':'las por vencer','Programado':'las programadas','Sin registrar':'las sin registrar'};
  return m[fPl.estado]||'esta lista';
}

function okPlan(id){
  const ant=DB.planes.find(x=>x.id===id)||{};
  const nuevaFrec=val('frec');
  const p={id:id||uid('PM'),activo:val('activo'),nombre:val('nombre'),base:val('base'),intervalo:valn('intervalo'),
    frec:nuevaFrec,tipoMtto:val('tipoMtto'),
    semanas:(ant.semanas||[]).slice(),semEjec:ant.semEjec||[],semEjecA:ant.semEjecA,semNoAplicaA:ant.semNoAplicaA,semExcel:ant.semExcel||false,
    ultima:val('ultima'),lecturaUlt:valn('lecturaUlt'),resp:val('resp'),dur:valn('dur'),costo:valn('costo'),tareas:val('tareas')};
  /* Si es nueva o le cambiaron la frecuencia, se reparten las intervenciones en el año */
  if(!id || (ant.frec||'')!==nuevaFrec || !p.semanas.length){
    p.semanas=semanasQueTocan(p);
    if(!id || (ant.frec||'')!==nuevaFrec) p.semExcel=false;
  }
  if(!p.nombre||!p.activo) return toast('La actividad y el equipo son obligatorios','err');
  if(id){ const i=DB.planes.findIndex(x=>x.id===id); DB.planes[i]=p; } else DB.planes.push(p);

}

/* Núcleo compartido para generar la OT preventiva de UN plan: crea la orden
   y deja la actividad marcada como ejecutada en la semana actual. No llama a
   save() ni refresca la pantalla — eso lo hace quien invoca esta función, así
   generarOT() guarda una sola vez y generarOTsMasivo() guarda una sola vez
   al final del lote, en lugar de una vez por cada OT generada. */
function _crearOTDePlan(p){
  const a=DB.activos.find(x=>x.id===p.activo)||{};
  const ot={id:siguienteOT(),activo:p.activo,tipo:'Preventivo',prioridad:'Media',descripcion:p.nombre,
    estado:'Abierta',fecha:today(),fechaCierre:'',tecnico:p.resp,hParo:0,hReparacion:Number(p.dur)||0,
    costoMO:0,costoMat:0,falla:false,notas:'Tareas: '+p.tareas,plan:p.id};
  DB.ots.push(ot);
  p.ultima=today(); p.lecturaUlt=Number(a.lectura)||0;
  const w=semActual(), ejg=ejecSemEd(p,new Date().getFullYear());
  if(!ejg.includes(w)) ejg.push(w);
  espejoEjec(p);
  return ot;
}
function generarOT(planId){
  const p=DB.planes.find(x=>x.id===planId); if(!p) return;
  _crearOTDePlan(p);
  save('OT generada, semana marcada como ejecutada y actividad reprogramada');
}
/* Generación masiva: una OT por cada id de plan recibido (el filtro visible
   en pantalla, o las marcadas con casilla). Pide confirmación con el total
   antes de crear nada, porque es una acción que crea muchos registros de una
   sola vez. */
function generarOTsMasivo(ids,etiqueta){
  ids=(ids||[]).filter(id=>DB.planes.some(p=>p.id===id));
  if(!ids.length) return toast('No hay actividades para generar: revisa los filtros o marca alguna con la casilla','err');
  const conNombre=etiqueta&&etiqueta!=='esta lista'&&etiqueta!=='seleccionadas';
  if(!confirm('Se van a generar '+ids.length+' orden(es) de trabajo preventiva(s)'+(conNombre?' de '+etiqueta:'')+', una por cada actividad.\n\n'+
    'Cada una queda en estado "Abierta", lista para asignar técnico, y la actividad correspondiente se marca como ejecutada en la semana actual.\n\n¿Continuar?')) return;
  let n=0;
  ids.forEach(id=>{ const p=DB.planes.find(x=>x.id===id); if(!p) return; _crearOTDePlan(p); n++; });
  PM_SEL={};
  save(n+' orden(es) de trabajo preventiva(s) generada(s)');
}

/* Serie mensual de indicadores.
   Nunca arranca antes del inicio de conteo: los meses sin historia no se dibujan
   para que la línea no caiga a cero por falta de datos. */
function serieKPI(maxMeses=12){
  const labels=[],disp=[],mttr=[],mtbf=[],mdt=[],fallas=[],costo=[],claves=[];
  const c=rangoConfiable(RANGO);
  if(c.vacio) return{labels,disp,mttr,mtbf,mdt,fallas,costo,claves};
  const ini=new Date(c.r.desde+'T00:00:00'), fin=new Date(c.r.hasta+'T00:00:00');
  let cur=new Date(ini.getFullYear(),ini.getMonth(),1);
  const meses=[];
  while(cur<=fin && meses.length<maxMeses*4){ meses.push(new Date(cur)); cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); }
  const usar=meses.slice(-maxMeses);
  usar.forEach(d=>{
    const desde=ymd(d), hasta=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));
    const k=kpis({desde,hasta,area:RANGO.area,activo:RANGO.activo});
    if(k.sinHistoria) return;
    labels.push(MESES[d.getMonth()]+' '+String(d.getFullYear()).slice(2));
    claves.push(desde.slice(0,7));
    disp.push(k.DISP); mttr.push(k.MTTR); mtbf.push(k.MTBF); mdt.push(k.MDT);
    fallas.push(k.fallas); costo.push(k.costo);
  });
  return{labels,disp,mttr,mtbf,mdt,fallas,costo,claves};
}

/* =========================================================
   HISTORIAL DE INDICADORES (snapshot mensual para gerencia)
   ---------------------------------------------------------
   A diferencia de serieKPI()/kpis(), que recalculan siempre en vivo contra
   las OTs actuales, aquí se guarda una "fotografía" fija de los indicadores
   de un mes ya cerrado, en una tabla aparte (historial_indicadores) que no
   se toca aunque después alguien corrija una OT antigua. Así el número que
   se le presentó a gerencia en su momento no cambia con el tiempo.
   ========================================================= */
const claveMes=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
/* Calcula (sin guardar) los indicadores de UN mes completo, dado su primer día. */
function calcularIndicadoresMes(d){
  const desde=ymd(d), hasta=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));
  const k=kpis({desde,hasta,area:'',activo:''});
  return {k,desde,hasta};
}
/* Guarda (o reemplaza) el snapshot de un mes para la empresa activa. */
function guardarSnapshotMes(d){
  if(!EMPRESA) return null;
  const {k,desde,hasta}=calcularIndicadoresMes(d);
  if(k.sinHistoria) return null;  // mes anterior al inicio de conteo de indicadores: no aplica
  const clave=claveMes(d), id=EMPRESA+'-'+clave;
  const reg={id,empresa:EMPRESA,clave,anio:d.getFullYear(),mes:d.getMonth()+1,desde,hasta,
    equipos:k.act.length,totalOTs:k.total,cerradas:k.cerradas,abiertas:k.abiertas,fallas:k.fallas,
    disp:k.DISP,mttr:k.MTTR,mdt:k.MDT,mtbf:k.MTBF,mttf:k.MTTF,
    cumplPM:k.cumplPM,pmTot:k.pmTot,pmCerr:k.pmCerr,cumplOT:k.cumplOT,tiempoMedioCierre:k.tiempoMedioCierre,
    ratioPrev:k.ratioPrev,costo:k.costo,costoMO:k.costoMO,costoMat:k.costoMat,
    tProgramado:k.tProgramado,tOperativo:k.tOperativo,tParo:k.tParo,
    generado:today(),generadoPor:SESION?SESION.nombre:''};
  const i=DB.historial_indicadores.findIndex(x=>x.id===id);
  if(i>=0) DB.historial_indicadores[i]=reg; else DB.historial_indicadores.push(reg);
  return reg;
}
/* Revisa, al entrar al sistema, si hay meses ya cerrados (terminaron antes de
   hoy) sin snapshot todavía, y los genera solo. No hace nada con el mes en
   curso (todavía no ha terminado) ni con meses previos al inicio de conteo.
   Solo lo ejecutan Administrador/Planificador (mismos roles que pueden
   escribir en la tabla según las políticas del servidor). */
function autoSnapshotIndicadores(){
  try{
    if(!EMPRESA || !edita('kpi')) return;
    const ini=new Date(inicioKPI()+'T00:00:00');
    let cur=new Date(ini.getFullYear(),ini.getMonth(),1);
    const hoy=new Date(), limite=new Date(hoy.getFullYear(),hoy.getMonth(),1); // mes en curso: excluido
    let generados=0;
    while(cur<limite){
      const id=EMPRESA+'-'+claveMes(cur);
      if(!DB.historial_indicadores.some(x=>x.id===id) && guardarSnapshotMes(cur)) generados++;
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    }
    if(generados) store();
  }catch(e){ /* silencioso: nunca debe interrumpir el arranque de la app */ }
}
function historialOrdenado(){
  return DB.historial_indicadores.filter(x=>x.empresa===EMPRESA).sort((a,b)=>a.clave.localeCompare(b.clave));
}

/* =========================================================
   VISTA: CHECKLISTS E INSPECCIONES
   ========================================================= */
/* =========================================================
   ALERTA POR HORAS DE TRABAJO
   El técnico carga el horómetro al hacer el check list; cuando el equipo
   acumula las horas configuradas desde su último servicio, salta la alerta.
   ========================================================= */
/* Lectura vigente de un equipo: la del catálogo o la última que cargó un técnico
   en el check list, la que sea mayor. Así el técnico no necesita permiso para
   escribir en el catálogo de equipos: basta con su inspección. */
function lecturaActual(a){
  let lec=Number(a.lectura)||0, fecha=a.fecha||'';
  (DB.inspecciones||[]).forEach(i=>{
    if(i.activo===a.id && Number(i.lectura)>lec){ lec=Number(i.lectura); fecha=i.fecha; }
  });
  return {lectura:lec,fecha};
}
function alertaHoras(a){
  const cada=Number(a.alertaHoras)||0;
  if(!cada) return null;
  const lec=lecturaActual(a).lectura, base=Number(a.lecturaServicio)||0;
  const usadas=Math.max(0,lec-base);
  const pct=cada?(usadas/cada)*100:0;
  return {cada,usadas,restante:cada-usadas,pct,
    estado: usadas>=cada?'Cumplido':pct>=90?'Por cumplir':'En rango',
    unidad:(a.lecturaTipo==='Odómetro')?'km':'h'};
}
function equiposConAlerta(){
  return DB.activos.filter(a=>a.estado!=='De baja').map(a=>({a,al:alertaHoras(a)}))
    .filter(x=>x.al && x.al.estado!=='En rango')
    .sort((x,y)=>y.al.pct-x.al.pct);
}
function registrarServicioHoras(id){
  const a=DB.activos.find(x=>x.id===id); if(!a) return;
  const lv=lecturaActual(a);
  a.lectura=lv.lectura; a.fecha=lv.fecha||today();
  a.lecturaServicio=lv.lectura; a.fechaServicio=today();
  save('Servicio registrado en '+a.id+': el contador vuelve a cero');
}
function tarjetaAlertaHoras(){
  const L=equiposConAlerta();
  if(!L.length) return '';
  const cumplidos=L.filter(x=>x.al.estado==='Cumplido').length;
  return `<div class="card" style="margin-bottom:16px;border-color:${cumplidos?'#c23b3b':'#b8790a'}">
    <div class="ch"><div><h3>⚠ EQUIPOS QUE ALCANZARON SUS HORAS DE TRABAJO</h3>
      <p>Comparación entre la lectura cargada en el check list y la del último servicio</p></div></div>
    ${tabla([{t:'Equipo'},{t:'Lectura actual',num:1},{t:'Último servicio',num:1},{t:'Acumulado',num:1},{t:'Intervalo',num:1},{t:'Avance'},{t:'Estado'},{t:''}],
      L.map(x=>[esc(nombreActivo(x.a.id).slice(0,34)),
        num(lecturaActual(x.a).lectura,0)+' '+x.al.unidad+` <span class="hint">(${lecturaActual(x.a).fecha||'—'})</span>`,
        num(Number(x.a.lecturaServicio)||0,0)+' '+x.al.unidad+(x.a.fechaServicio?` <span class="hint">(${x.a.fechaServicio})</span>`:''),
        `<b style="color:${x.al.estado==='Cumplido'?'#c23b3b':'#a3670a'}">${num(x.al.usadas,0)} ${x.al.unidad}</b>`,
        num(x.al.cada,0)+' '+x.al.unidad,
        `<div class="pbar" style="width:90px"><i class="${x.al.estado==='Cumplido'?'r':'w'}" style="width:${Math.min(100,x.al.pct)}%"></i></div>`,
        `<span class="tag ${x.al.estado==='Cumplido'?'t-r':'t-w'}">${x.al.estado==='Cumplido'?'Cumplió '+num(x.al.cada,0)+' '+x.al.unidad:'Faltan '+num(x.al.restante,0)+' '+x.al.unidad}</span>`,
        edita('activos')||edita('ots')
          ? `<div class="rowend">${edita('ots')?`<button class="btn sm p" onclick="otPorHoras('${js(x.a.id)}')">Generar OT</button>`:''}
              ${edita('activos')?`<button class="btn sm" onclick="registrarServicioHoras('${js(x.a.id)}')">Servicio hecho</button>`:''}</div>`
          : '<span class="hint">Avisa a mantenimiento</span>']))}
  </div>`;
}
function otPorHoras(id){
  const a=DB.activos.find(x=>x.id===id); if(!a) return;
  const al=alertaHoras(a)||{cada:0,unidad:'h'};
  DB.ots.push({id:siguienteOT(),activo:id,tipo:'Preventivo',prioridad:'Alta',
    descripcion:'Servicio por '+num(al.cada,0)+' '+al.unidad+' de trabajo',
    estado:'Abierta',fecha:today(),fechaCierre:'',tecnico:DB.tecnicos[0]||'',hParo:0,hReparacion:0,
    costoMO:0,costoMat:0,falla:false,
    notas:'Lectura al generar la OT: '+num(lecturaActual(a).lectura,0)+' '+al.unidad,plan:''});
  save('OT de servicio generada para '+id);
}

function textoLectura(eq){

  return `Última lectura registrada: <b>${num(lv.lectura,0)}</b>${lv.fecha?' ('+lv.fecha+')':''}. `+

       :'Este equipo no tiene alerta por horas configurada (se activa en el catálogo de equipos).');
}
function okInsp(id,checkId){
  const c=DB.checklists.find(x=>x.id===checkId)||{items:[]};
  const prev=DB.inspecciones.find(x=>x.id===id)||{};
  const o={id:id||uid('IN'),checklist:checkId,activo:val('activo'),fecha:val('fecha'),inspector:val('inspector'),
    lectura:valn('lectura'),ot:val('ot')||'',
    resultados:c.items.map((_,j)=>val('r'+j)||'Conforme'),hallazgos:val('hallazgos'),
    otPorPunto:prev.otPorPunto||{}};
  if(id){const i=DB.inspecciones.findIndex(x=>x.id===id);DB.inspecciones[i]=o;} else DB.inspecciones.push(o);
  /* La lectura que carga el técnico actualiza el equipo y dispara la alerta por horas */
  let aviso='Inspección registrada';
  const eq=DB.activos.find(x=>x.id===o.activo);
  if(eq && o.lectura>0){
    if(edita('activos') && o.lectura>=(Number(eq.lectura)||0)){ eq.lectura=o.lectura; eq.fecha=o.fecha; }
    const al=alertaHoras(eq);
    if(al && al.estado==='Cumplido')
      aviso='⚠ '+eq.id+' llegó a '+num(al.usadas,0)+' '+al.unidad+' desde su último servicio (intervalo '+num(al.cada,0)+' '+al.unidad+'). Toca servicio.';
    else if(al && al.estado==='Por cumplir')
      aviso='Inspección registrada · a '+eq.id+' le faltan '+num(al.restante,0)+' '+al.unidad+' para su servicio';
  }
  save(aviso);
}

/* Convierte un punto "No conforme" de una inspección en una orden de trabajo
   correctiva, con el equipo y la descripción ya prellenados. Si ese punto ya
   generó una OT antes, no duplica: solo la muestra. */
function generarOTDesdeHallazgo(inspId,j){
  if(!edita('ots')) return;
  const i=DB.inspecciones.find(x=>x.id===inspId); if(!i) return;
  i.otPorPunto=i.otPorPunto||{};
  if(i.otPorPunto[j]) return; // ya existe, no duplicar
  const c=DB.checklists.find(x=>x.id===i.checklist)||{nombre:'',items:[]};
  const punto=c.items[j]||'Hallazgo de inspección';
  const nid=siguienteOT();
  DB.ots.push({id:nid,activo:i.activo,tipo:'Correctivo',prioridad:'Media',
    descripcion:(c.nombre?c.nombre+': ':'')+punto,
    estado:'Abierta',fecha:today(),fechaCierre:'',tecnico:i.inspector||DB.tecnicos[0]||'',
    hParo:0,hReparacion:0,costoMO:0,costoMat:0,falla:false,categoria:'',contacto:'',
    notas:'Generada desde hallazgo de inspección '+i.id+' ('+(c.nombre||'sin formato')+', punto #'+(j+1)+').'+
      (i.hallazgos?' Notas del inspector: '+i.hallazgos:''),
    plan:'',fotos:[],solicitante:SESION?SESION.nombre:'',areaSolicitante:SESION?SESION.area:'',creada:today()});
  i.otPorPunto[j]=nid;
  save('OT '+nid+' generada desde el hallazgo de la inspección '+i.id);
}
function expInsp(){
  const rows=[];
  DB.inspecciones.forEach(i=>{const c=DB.checklists.find(x=>x.id===i.checklist)||{nombre:'',items:[]};
    c.items.forEach((it,j)=>rows.push([i.fecha,c.nombre,c.tipo||'',i.activo,i.inspector,i.lectura||0,j+1,it,i.resultados[j]||'',i.hallazgos,i.ot||'',(i.otPorPunto||{})[j]||'']));});
  csv('Inspecciones',['Fecha','Formato','Tipo','Equipo','Inspector','Lectura','No','Punto','Resultado','Hallazgos','OT_relacionada','OT_generada_del_hallazgo'],rows);
}

function impJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ try{ const d=JSON.parse(e.target.result);
      if(!d.activos||!d.ots) throw 0;
      if(!confirm('Se reemplazarán los datos DE TODOS LOS USUARIOS por los del archivo.\n\n¿Continuar?')) return;
      DB=d; ['areas','tecnicos','planes','presupuesto','checklists','inspecciones'].forEach(k=>{if(!DB[k])DB[k]=[]});
      store(); render(); toast('Respaldo restaurado correctamente');
    }catch(err){ toast('El archivo no es un respaldo válido','err'); } };
  r.readAsText(f); inp.value='';
}

const FUENTES=['Manual','Disponibilidad (%)','Cumplimiento PM (%)','Índice de preventivo (%)','MTTR (h)','Costo del periodo'];
function valorObjetivo(o){
  if(o.fuente==='Manual'||!o.fuente) return Number(o.actual)||0;
  const k=kpis({desde:DB.config.anio+'-01-01',hasta:today(),area:'',activo:''});
  return {'Disponibilidad (%)':k.DISP,'Cumplimiento PM (%)':k.cumplPM,'Índice de preventivo (%)':k.ratioPrev,
          'MTTR (h)':k.MTTR,'Costo del periodo':k.costo}[o.fuente]||0;
}

        <button class="btn p ed" onclick="formObj()">+ Nuevo objetivo</button>`);

    const act=valorObjetivo(o), meta=Number(o.meta)||0;
    const pct=meta? (o.menorMejor? Math.min(200,(meta/Math.max(act,.0001))*100) : (act/meta)*100) : 0;
    return{o,act,meta,pct};

  const logrados=objs.filter(x=>x.pct>=100).length;
  set(`

    ${tile('Avance promedio',num(objs.length?objs.reduce((s,x)=>s+Math.min(100,x.pct),0)/objs.length:0,1),'%','v','Sobre las metas del ejercicio')}

    <div style="margin-top:10px"><button class="btn p ed" onclick="DB.politica=val('politica');save('Política guardada')">Guardar política</button></div>
  </div>
  <div class="card">
    <div class="ch"><div><h3>OBJETIVOS DEL EJERCICIO</h3>
      <p>Los objetivos con fuente automática toman su valor real directamente de los indicadores del sistema</p></div></div>
    ${tabla([{t:'Objetivo'},{t:'Indicador'},{t:'Fuente'},{t:'Meta',num:1},{t:'Real',num:1},{t:'Avance'},{t:'%',num:1},{t:'Responsable'},{t:'Plazo'},{t:''}],

        num(x.meta,x.meta%1?2:0),num(x.act,2),
        `<div class="pbar" style="width:120px"><i class="${x.pct>=100?'g':x.pct>=80?'w':'r'}" style="width:${Math.min(100,x.pct)}%"></i></div>`,
        `<b style="color:${x.pct>=100?'#1f8a4c':x.pct>=80?'#a3670a':'#c23b3b'}">${num(x.pct,0)}%</b>`,

function vFlujo(){
  acts(`<button class="btn" onclick="window.print()">⎙ Imprimir</button>

      </div>

    </div>`).join('')||'<div class="empty">Sin etapas definidas.</div>'}
  </div>`);
}
function diagramaFlujo(F2){
  if(!F2.length) return '<div class="empty">Sin etapas para diagramar</div>';
  const W=920, bw=178, bh=58, gapY=86, porFila=4;
  const filas=Math.ceil(F2.length/porFila), H=filas*gapY+30;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  F2.forEach((f,i)=>{
    const fila=Math.floor(i/porFila), col=i%porFila;
    const izq=fila%2===1;
    const c=izq?(porFila-1-col):col;
    const x=24+c*(bw+40), y=16+fila*gapY;
    const dec=/\?|decid|autoriz|aprob|urgen/i.test(f.paso);
    s+=dec
      ? `<polygon points="${x+bw/2},${y} ${x+bw},${y+bh/2} ${x+bw/2},${y+bh} ${x},${y+bh/2}" fill="rgba(245,158,11,.16)" stroke="#f59e0b" stroke-width="1.6"/>`
      : `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="10" fill="rgba(15,76,129,.07)" stroke="#0f4c81" stroke-width="1.6"/>`;
    s+=`<text x="${x+bw/2}" y="${y+bh/2+4}" text-anchor="middle" fill="#182430" font-size="11" font-weight="700">
        ${esc(f.paso).slice(0,24).split(' ').reduce((a,w)=>{const l=a[a.length-1];(l+' '+w).length>20?a.push(w):a[a.length-1]=l?l+' '+w:w;return a;},['']).map((l,j,arr)=>`<tspan x="${x+bw/2}" dy="${j?13:(arr.length>1?-6:0)}">${esc(l)}</tspan>`).join('')}</text>`;
    s+=`<circle cx="${x+14}" cy="${y+13}" r="11" fill="#0f4c81"/><text x="${x+14}" y="${y+17}" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">${i+1}</text>`;
    if(i<F2.length-1){
      const nf=Math.floor((i+1)/porFila);
      if(nf===fila){ const dir=izq?-1:1;
        s+=`<line x1="${x+(dir>0?bw:0)}" y1="${y+bh/2}" x2="${x+(dir>0?bw+40:-40)}" y2="${y+bh/2}" stroke="#0f4c81" stroke-width="1.6" marker-end="url(#ar)"/>`;
      } else {
        s+=`<line x1="${x+bw/2}" y1="${y+bh}" x2="${x+bw/2}" y2="${y+gapY}" stroke="#0f4c81" stroke-width="1.6" marker-end="url(#ar)"/>`;
      }
    }
  });
  s+=`<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0f4c81"/></marker></defs></svg>`;
  return s;
}

function okBit(id){
  const b={id:id||uid('BT'),fecha:val('fecha'),activo:val('activo'),turno:val('turno'),operador:val('operador'),
    lecturaIni:valn('lecturaIni'),lecturaFin:valn('lecturaFin'),horasOp:valn('horasOp'),paro:valn('paro'),
    falla:val('falla')==='1',descFalla:val('descFalla'),obs:val('obs')};
  if(!b.activo) return toast('Selecciona un equipo','err');
  if(!b.horasOp&&b.lecturaFin>b.lecturaIni) b.horasOp=+(b.lecturaFin-b.lecturaIni).toFixed(1);
  if(id){const i=DB.bitacora.findIndex(x=>x.id===id);DB.bitacora[i]=b;} else DB.bitacora.push(b);
  const a=DB.activos.find(x=>x.id===b.activo);
  if(a&&b.lecturaFin>(Number(a.lectura)||0)){ a.lectura=b.lecturaFin; a.fecha=b.fecha; }
  save('Jornada registrada'+(a&&a.lectura===b.lecturaFin?' · lectura del equipo actualizada':''));
}

/* Genera una copia del sistema con la conexión ya incluida.
   Así el personal abre el archivo o el link y va directo a poner su correo:
   nadie tiene que configurar nada ni conocer la clave. */
async function generarCopiaConfigurada(){
  if(!CONEX || !CONEX.url || !CONEX.key) return toast('Primero hay que configurar la conexión','err');
  // 1) si el sistema se abrió desde un link, se lee a sí mismo
  if(location.protocol!=='file:'){
    try{
      const r=await fetch(location.href,{cache:'no-store'});
      if(r.ok) return prepararCopia(await r.text());
    }catch(e){}
  }
  // 2) si no, se pide el archivo del sistema y se prepara igual (funciona sin internet)
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.html,text/html';
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    try{ prepararCopia(await f.text()); }
    catch(e){ toast('No se pudo leer el archivo: '+e.message,'err'); }
  };
  inp.click();
  toast('Elige el archivo del sistema (el .html) para preparar la copia');
}
function prepararCopia(html){
  const MARCA='<!--CONEXION'+'-INCLUIDA-->';   // se arma en trozos para no detectarse a sí mismo
  if(html.indexOf(MARCA)>=0) return toast('Ese archivo ya viene configurado','err');
  const marca='<scr'+'ipt src="https://cdn.jsdelivr.net';
  if(html.indexOf(marca)<0) return toast('Ese no parece el archivo del sistema','err');
  const inyec=MARCA+'\n<scr'+'ipt>\n'+
    'const SUPABASE_URL='+JSON.stringify(CONEX.url)+';\n'+
    'const SUPABASE_ANON_KEY='+JSON.stringify(CONEX.key)+';\n'+
    '</scr'+'ipt>\n';
  bajar('index.html', html.replace(marca, inyec+marca), 'text/html;charset=utf-8');
  toast('Listo: reparte ese index.html. Quien lo abra irá directo a poner su correo');
}

let SESION=null, PERFIL=null;
function pantalla(html){ document.getElementById('app').classList.add('home');
  document.getElementById('view').innerHTML=html; }

function vConfigurar(msg){
  pantalla(`<div class="login-wrap"><div class="login-card" style="max-width:560px">
    <h1>CONFIGURAR LA CONEXIÓN</h1>
    <div class="sb">Sistema Total de Mantenimiento · modo en línea</div>

    <div class="fld"><label>URL del proyecto</label>
      <input id="c_url" placeholder="https://xxxxxxxxxxxx.supabase.co" value="${CONEX?esc(CONEX.url):''}"></div>
    <div class="fld"><label>Clave pública (anon / public)</label>

  </div></div>`);

async function probarConexion(){
  const u=document.getElementById('c_url').value.trim(), k=document.getElementById('c_key').value.trim();
  if(!/^https:\/\/.+\.supabase\.co/.test(u)) return toast('La URL debe verse como https://xxxx.supabase.co','err');
  if(k.length<40) return toast('La clave pública parece incompleta','err');
  guardarConexion(u,k);
  try{ crearCliente(); const {error}=await SB.from('config').select('id').limit(1);
    if(error&&!/row-level|permission/i.test(error.message)) throw new Error(error.message);
    toast('Conexión correcta'); vAcceso();
  }catch(e){ vConfigurar('No se pudo conectar: '+e.message+'. Revisa la URL y la clave.'); }
}
function crearCliente(){
  SB=window.supabase.createClient(CONEX.url,CONEX.key,{auth:{persistSession:true,autoRefreshToken:true}});
}

const EMPRESAS_BASE=[{id:'AV',nombre:'ACEITES VERDES'},{id:'SUT',nombre:'SUTRIMEX PERU SAC'}];

  const d=(DB&&DB.empresas&&DB.empresas.length)?DB.empresas:EMPRESAS_BASE;

  </div></div>`);
