/* Si lo que escriben no tiene "@" (un usuario interno, no un correo real), se completa solo con el dominio interno */
function normalizarIdentificador(v){
  v=(v||'').trim().toLowerCase();
  if(!v||v.includes('@')) return v;
  return v+'@'+(typeof DOMINIO_INTERNO!=='undefined'?DOMINIO_INTERNO:'aceitesverdescolombia.local');
}
async function entrar(){
  const email=normalizarIdentificador(document.getElementById('a_mail').value);
  const pass=document.getElementById('a_pass').value;
  const emp=(document.getElementById('a_emp')||{}).value||ACC.empresa;
  if(!email||!pass) return toast('Escribe tu usuario y tu contraseña','err');
  if(!emp) return toast('Elige la empresa','err');
  ACC.email=document.getElementById('a_mail').value.trim(); ACC.empresa=emp;
  const b=document.getElementById('a_btn'); if(b){ b.textContent='Entrando…'; b.disabled=true; }
  const {data,error}=await SB.auth.signInWithPassword({email,password:pass});
  if(error){ return vAcceso(/Invalid login/i.test(error.message)
      ? 'Usuario o contraseña incorrectos.' : 'No se pudo entrar: '+error.message); }
  await iniciarSesion(data.user);
}
async function recuperar(){
  const email=normalizarIdentificador(document.getElementById('a_mail').value);
  if(!email) return toast('Escribe primero tu usuario','err');
  if(typeof esCorreoInterno==='function'&&esCorreoInterno(email)){
    return vAcceso('Tu usuario no tiene un correo real, así que no se te puede enviar un enlace de recuperación. Pídele al administrador que te restablezca la contraseña desde el módulo de Usuarios.','r');
  }
  const {error}=await SB.auth.resetPasswordForEmail(email);
  vAcceso(error?('No se pudo enviar: '+error.message)
    :'Te enviamos un correo para restablecer la contraseña. Revisa tu bandeja.',error?'r':'g');
}
async function cambiarEmpresa(){
  const otras=misEmpresas().filter(e=>e!==EMPRESA);
  if(!otras.length) return toast('Tu cuenta sólo tiene una empresa','err');
  const nom=x=>{const e=listaEmpresas().find(y=>y.id===x); return e?e.nombre:x;};
  modal('Cambiar de empresa',
    `<p class="hint" style="margin-bottom:14px">Estás en <b>${esc(empresaNombre())}</b>. Elige a cuál quieres pasar:</p>`+
    otras.map(e=>`<button class="btn p" style="width:100%;justify-content:center;margin-bottom:8px"
      onclick="irAEmpresa('${js(e)}')">${esc(nom(e))}</button>`).join(''),
    `<button class="btn" onclick="closeModal()">Cancelar</button>`);
}
async function irAEmpresa(id){
  if(misEmpresas().indexOf(id)<0) return toast('Tu cuenta no tiene acceso a esa empresa','err');
  closeModal(); EMPRESA=id; SESION.empresa=id;
  try{ localStorage.setItem(KEY_EMP,id); }catch(e){}
  try{ await cargarTodo(); autoSnapshotIndicadores(); suscribir(); VISTA='inicio'; render(); toast('Ahora estás en '+empresaNombre()); }
  catch(e){ pantallaError(e,'cambio de empresa'); }
}
function vCambiarMiClave(){
  modal('Cambiar mi contraseña',
    `<div class="fld"><label>Nueva contraseña</label>
       <input id="f_clave1" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></div>
     <div class="fld"><label>Repetir la nueva contraseña</label>
       <input id="f_clave2" type="password" autocomplete="new-password" placeholder="Escríbela de nuevo"
         onkeydown="if(event.key==='Enter')guardarMiClave()"></div>
     <p class="hint">Se reemplaza la contraseña que tenías (la temporal o la anterior). Úsala la próxima vez que entres, y no se la compartas a nadie.</p>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn p" id="btn_guardar_clave" onclick="guardarMiClave()">Guardar</button>`);

async function guardarMiClave(){
  const p1=(document.getElementById('f_clave1')||{}).value||'';
  const p2=(document.getElementById('f_clave2')||{}).value||'';
  if(p1.length<6) return toast('La contraseña debe tener al menos 6 caracteres','err');
  if(p1!==p2) return toast('Las dos contraseñas no coinciden','err');
  const b=document.getElementById('btn_guardar_clave'); if(b){ b.textContent='Guardando…'; b.disabled=true; }
  try{
    const {error}=await SB.auth.updateUser({password:p1});
    if(error) throw new Error(error.message);
    closeModal(); toast('Contraseña actualizada. Úsala la próxima vez que entres.');
  }catch(e){
    toast('No se pudo cambiar la contraseña: '+(e.message||e),'err');
    if(b){ b.textContent='Guardar'; b.disabled=false; }
  }
}
async function salir(){
  try{ await SB.auth.signOut(); }catch(e){}
  if(CANAL){ try{ SB.removeChannel(CANAL); }catch(e){} CANAL=null; }
  SESION=null; PERFIL=null; DB=vacio(); ACC.email=''; EMPRESA=null;
  try{ localStorage.removeItem(KEY); }catch(e){}
  vAcceso('Sesión cerrada.','g');
}

async function iniciarSesion(user){
  pantalla(`<div class="login-wrap"><div class="login-card" style="text-align:center">
    <h1>CARGANDO</h1><div class="sb">Sincronizando la información del área…</div>
    <div class="cargando"><i></i><i></i><i></i></div></div>`);
  try{
    const {data:perf,error}=await SB.from('usuarios').select('data');
    if(error) throw new Error(error.message);
    const yo=(perf||[]).map(x=>x.data).find(u=>
      (u.auth_id&&u.auth_id===user.id) || (u.email||'').toLowerCase()===(user.email||'').toLowerCase());
    if(!yo) return vAcceso('Tu cuenta existe pero aún no tiene perfil en el sistema. Pide al administrador que dé de alta tu correo en el módulo de Usuarios.');
    if(yo.activo===false) return vAcceso('Tu acceso está desactivado. Contacta al jefe de mantenimiento.');
    PERFIL=yo;
    // ¿tiene acceso a la empresa elegida?
    const suyas=Array.isArray(yo.empresas)&&yo.empresas.length?yo.empresas:['AV'];
    const pedida=ACC.empresa||suyas[0];
    if(suyas.indexOf(pedida)<0){
      const nom=(x)=>{const e=listaEmpresas().find(y=>y.id===x); return e?e.nombre:x;};
      await SB.auth.signOut(); SESION=null; PERFIL=null;
      return vAcceso('Tu cuenta no tiene acceso a '+nom(pedida)+'. Pertenece a: '+suyas.map(nom).join(', ')+'.');
    }
    EMPRESA=pedida;
    try{ localStorage.setItem(KEY_EMP,EMPRESA); }catch(e){}
    SESION={id:yo.id,nombre:yo.nombre,rol:yo.rol,area:yo.area||'',email:yo.email||user.email,empresa:EMPRESA};
    await cargarTodo();
    autoSnapshotIndicadores();
    suscribir();
    VISTA=inicioDe(); render(); pintarEstado();
    toast('Bienvenido, '+yo.nombre);
  }catch(e){
    const c=leerCache();
    if(c){ DB=c; tomarFoto(); ESTADO.red='sin conexion'; ESTADO.error=e.message;
      VISTA=inicioDe(); render(); pintarEstado();
      toast('Sin conexión: estás viendo la última copia descargada','err');
    } else vAcceso('No se pudo cargar la información: '+e.message);
  }
}

function pintarChip(){
  const c=document.getElementById('uChip');
  if(!c) return;
  c.innerHTML=SESION?`<div class="av">${iniciales(SESION.nombre)}</div>
    <div><b>${esc(SESION.nombre)}</b><span class="rol">${esc(empresaNombre())} · ${esc(SESION.rol)}${SESION.area?' · '+esc(SESION.area):''}</span></div>
    <button class="btn sm gh" onclick="salir()" title="Cerrar sesión">Salir</button>`:'';
}
async function arrancar(){
  try{
    CONEX=leerConexion();
    if(!CONEX) return vConfigurar();
    if(!window.supabase) return vConfigurar('No se pudo cargar la librería de conexión. Revisa que el equipo tenga internet y vuelve a intentar.');
    crearCliente();
    SB.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'&&SESION){ SESION=null; vAcceso(); } });
    try{ ACC.empresa=localStorage.getItem(KEY_EMP)||''; }catch(e){}
    const {data}=await SB.auth.getSession();
    if(data&&data.session&&data.session.user) await iniciarSesion(data.session.user);
    else vAcceso();
  }catch(e){ pantallaError(e,'arranque'); }
}

function okEjec(id,forzar){
  const o=DB.ots.find(x=>x.id===id); if(!o) return;
  o.notas=val('notas'); o.hParo=valn('hParo'); o.hReparacion=valn('hReparacion');
  o.costoMO=valn('costoMO'); o.costoMat=valn('costoMat');
  o.horaInicio=val('horaInicio'); o.horaFin=val('horaFin'); o.impacto=val('impacto')||'Sin afectación';
  o.estado=forzar||val('estado'); o.fechaCierre=val('fechaCierre');
  if(['Por aprobar','Cerrada'].includes(o.estado)&&!o.fechaCierre) o.fechaCierre=today();
  if(!['Por aprobar','Cerrada'].includes(o.estado)) o.fechaCierre='';
  o.ejecutor=SESION.nombre;
  save(o.estado==='Por aprobar'?'Orden '+o.id+' enviada a aprobación':'Avance guardado en '+o.id);
}

function otsDeMiArea(){
  return DB.ots.filter(o=>{
    if(o.areaSolicitante) return o.areaSolicitante===SESION.area;
    const a=DB.activos.find(x=>x.id===o.activo);
    return a && a.area===SESION.area;
  }).sort((a,b)=>b.fecha.localeCompare(a.fecha));
}
function vMiArea(){
  const mias=otsDeMiArea();
  const ab=mias.filter(o=>['Abierta','En proceso','En espera repuesto'].includes(o.estado));

async function okOTArea(id){
  const desc=val('descripcion'), act=val('activo');

      notas:val('notas'),falla:val('falla')==='1',solicitante:val('solicitante')});

  }

     así que numerar "la siguiente" con lo que tiene en pantalla puede chocar
     con una OT real de otra área. Se le pide el número real al servidor,
     que sí ve la tabla completa; si no hay conexión, se usa el cálculo local
     como respaldo (mejor que bloquear el reporte). */
  let nid;
  try{

    nid=data;
  }catch(e){ nid=siguienteOT(); }

    falla:val('falla')==='1',categoria:val('categoria'),contacto:'',notas:val('notas'),plan:'',fotos:[],
    solicitante:val('solicitante')||SESION.nombre,areaSolicitante:SESION.area,creada:today()});
  save('Orden de trabajo '+nid+' registrada. Mantenimiento ya puede verla.');
  formFotosOT(nid);
}

      let detalle='';
      try{ const cuerpo=await error.context.json(); detalle=cuerpo.error||''; }catch(e){}
      throw new Error(detalle||error.message||'Error desconocido');

const DOMINIO_INTERNO='aceitesverdescolombia.local';
function esCorreoInterno(email){ return (email||'').toLowerCase().endsWith('@'+DOMINIO_INTERNO); }
function generarCorreoInterno(nombre,excluirId){
  const base=(nombre||'usuario').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,'').trim().split(/\s+/).filter(Boolean).join('.')||'usuario';
  let n=1, candidato=base+'@'+DOMINIO_INTERNO;
  while(DB.usuarios.some(x=>(x.email||'').toLowerCase()===candidato&&x.id!==excluirId)){
    n++; candidato=base+n+'@'+DOMINIO_INTERNO;
  }
  return candidato;
}

  const ant=DB.usuarios.find(x=>x.id===id)||{};

  const nombre=val('nombre');
  let email=(val('email')||'').trim().toLowerCase();
  if(!email) email=esCorreoInterno(ant.email)?ant.email:generarCorreoInterno(nombre,id||undefined);
  const u={id:id||uid('US'),nombre,email,
    rol:val('rol'),area:val('area'),puesto:val('puesto'),activo:val('activo')==='1',auth_id:ant.auth_id||'',
    empresas:(ant.rol==='Administrador'&&Array.isArray(ant.empresas)&&ant.empresas.length>1)?ant.empresas:[emp]};
  if(!u.nombre) return toast('El nombre es obligatorio','err');
  if(!esCorreoInterno(u.email)&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u.email)) return toast('El correo no tiene un formato válido','err');
  if(u.rol==='Área'&&!u.area) return toast('Un usuario de rol Área debe tener un área asignada','err');
  if(DB.usuarios.some(x=>(x.email||'').toLowerCase()===u.email&&x.id!==u.id)) return toast('Ese correo ya está dado de alta','err');
  if(id){
    if(ant.rol==='Administrador'&&u.rol!=='Administrador'&&DB.usuarios.filter(x=>x.rol==='Administrador').length===1)
      return toast('Debe existir al menos un administrador','err');
    DB.ots.forEach(o=>{ if(o.tecnico===ant.nombre) o.tecnico=u.nombre; });
    const ti=DB.tecnicos.indexOf(ant.nombre); if(ti>=0) DB.tecnicos[ti]=u.nombre;
    DB.usuarios[DB.usuarios.findIndex(x=>x.id===id)]=u;
    if(SESION&&SESION.id===id) SESION={id:u.id,nombre:u.nombre,rol:u.rol,area:u.area||'',email:u.email};
  } else {
    DB.usuarios.push(u);
    if(u.rol==='Técnico'&&!DB.tecnicos.includes(u.nombre)) DB.tecnicos.push(u.nombre);
  }
  save('Usuario guardado');

/* Cada cuántas semanas del año (48 = 12 meses × 4) toca cada frecuencia */
const PASO_SEM={'Diario':1,'Semanal':1,'Quincenal':2,'Mensual':4,'Trimestral':12,'Semestral':24,'Anual':48};
/* Reparte las intervenciones de forma pareja en el año a partir de una semana ancla.
   Semestral con ancla en la semana 36 → 12 y 36, es decir una cada seis meses. */
function semanasPorFrecuencia(frec,ancla){
  const paso=PASO_SEM[frec];
  if(!paso) return [];
  let a=Number(ancla); if(!isFinite(a)||a<0) a=0;
  const inicio=a%paso;
  const out=[]; for(let w=inicio;w<48;w+=paso) out.push(w);
  return out;
}
/* Semana de referencia de una actividad: la que ya tenía cargada del Excel,
   si no la de su última ejecución, si no el arranque del año. */
function anclaPlan(p){
  const sem=(p.semanas||[]).slice().sort((x,y)=>x-y);
  if(sem.length) return sem[0];
  if(p.ultima) return semDeFecha(p.ultima);
  if(p.proxima_prevista) return semDeFecha(p.proxima_prevista);
  return 0;
}
/* Semanas que le corresponden a una actividad según su frecuencia */
function semanasQueTocan(p){
  const frec=p.frec||'';
  if(frec==='Personalizada'||!PASO_SEM[frec]) return (p.semanas||[]).slice();
  return semanasPorFrecuencia(frec,anclaPlan(p));
}
/* ¿La programación guardada coincide con lo que pide su frecuencia? */
function programacionIncompleta(p){
  if(!PASO_SEM[p.frec||'']) return false;
  const deben=semanasQueTocan(p), hay=(p.semanas||[]);
  return deben.length!==hay.length || deben.some(w=>!hay.includes(w));
}
function planesDesprogramados(){ return DB.planes.filter(programacionIncompleta); }
/* Rehace la programación de todas las actividades según su frecuencia */
function reprogramarPorFrecuencia(){
  const L=planesDesprogramados();
  if(!L.length) return toast('Todas las actividades ya están programadas según su frecuencia');
  const detalle=L.slice(0,6).map(p=>`• ${p.frec}: ${(p.semanas||[]).length} → ${semanasQueTocan(p).length} intervenciones`).join('\n');
  if(!confirm('Se van a reprogramar '+L.length+' actividades repartiendo sus intervenciones a lo largo del año '+
      'según la frecuencia de cada una.\n\n'+detalle+(L.length>6?'\n…y '+(L.length-6)+' más':'')+
      '\n\nLa fecha que ya tenían cargada se conserva como punto de partida. ¿Continuar?')) return;
  L.forEach(p=>{ p.semanas=semanasQueTocan(p); p.semExcel=false; });
  save('Reprogramadas '+L.length+' actividades según su frecuencia');
}
const DER_SEM={'Diario':semanasPorFrecuencia('Diario',0),'Semanal':semanasPorFrecuencia('Semanal',0),
  'Quincenal':semanasPorFrecuencia('Quincenal',0),'Mensual':semanasPorFrecuencia('Mensual',0),
  'Trimestral':semanasPorFrecuencia('Trimestral',0),'Semestral':semanasPorFrecuencia('Semestral',0),
  'Anual':semanasPorFrecuencia('Anual',16),'Personalizada':[]};

/* =========================================================
   CRONOGRAMA ANUAL MT-CR-01 (12 meses × 4 semanas)
   ========================================================= */
const FRECS=['Diario','Semanal','Quincenal','Mensual','Trimestral','Semestral','Anual','Personalizada'];
const FREC_DIAS={'Diario':1,'Semanal':7,'Quincenal':15,'Mensual':30,'Trimestral':90,'Semestral':180,'Anual':365};
const TIPOS_MTTO=['Preventivo','Lubricación','Inspección','Predictivo','Calibración','Capacitación','Correctivo programado'];
const semDeFecha=f=>{const d=new Date(f+'T00:00:00');return d.getMonth()*4+Math.min(3,Math.floor((d.getDate()-1)/7));};
const fechaDeSem=(i,y)=>{y=Number(y||anioCrono());return y+'-'+String(Math.floor(i/4)+1).padStart(2,'0')+'-'+String(1+(i%4)*7).padStart(2,'0');};

/* =========================================================
   AÑO DEL PROGRAMA
   El MT-CR-01 es una plantilla anual: las semanas programadas se repiten
   cada año. Lo que cambia de un año a otro es qué semanas se ejecutaron,
   por eso la ejecución se guarda separada por año en p.semEjecA.
   ========================================================= */
let ANIO_CR=null;
function anioCrono(){ if(ANIO_CR===null) ANIO_CR=Number(DB.config.anio)||new Date().getFullYear(); return ANIO_CR; }
function ponerAnio(y){ ANIO_CR=Number(y); }
function aniosDisponibles(){
  const base=Number(DB.config.anio)||new Date().getFullYear();
  const set=new Set([base-1,base,base+1,base+2,new Date().getFullYear(),anioCrono()]);
  (DB.planes||[]).forEach(p=>{ if(p.semEjecA) Object.keys(p.semEjecA).forEach(y=>set.add(Number(y))); });
  return [...set].filter(y=>y>2000&&y<2100).sort((a,b)=>a-b);
}
/* Semanas ejecutadas de un plan en un año — solo lectura, no toca el registro */
function ejecSem(p,y){
  y=String(y||anioCrono());
  if(p.semEjecA && Array.isArray(p.semEjecA[y])) return p.semEjecA[y];
  if(String(DB.config.anio)===y && Array.isArray(p.semEjec)) return p.semEjec;
  return [];
}
/* Igual, pero preparando el registro para escribir en él */
function ejecSemEd(p,y){
  y=String(y||anioCrono());
  if(!p.semEjecA || typeof p.semEjecA!=='object'){
    p.semEjecA={};
    if(Array.isArray(p.semEjec) && p.semEjec.length) p.semEjecA[String(DB.config.anio)]=p.semEjec.slice();
  }
  if(!Array.isArray(p.semEjecA[y])) p.semEjecA[y]=[];
  return p.semEjecA[y];
}
/* Semanas que, para un año dado, se tratan como "no aplica": no cuentan como
   programadas, ni ejecutadas, ni atrasadas — como si el plan no existiera esas
   semanas. Se usa para el arranque de un programa a mitad de año. */
function noApSem(p,y){
  y=String(y||anioCrono());
  return (p.semNoAplicaA && Array.isArray(p.semNoAplicaA[y])) ? p.semNoAplicaA[y] : [];
}
/* Deja p.semEjec como espejo del año en curso (lo usan los informes antiguos) */
function espejoEjec(p){ p.semEjec=(p.semEjecA&&p.semEjecA[String(DB.config.anio)])||[]; }
/* Semana "de corte" del año elegido: un año pasado está entero vencido,
   uno futuro no tiene nada vencido todavía */
function semActualDe(y){
  const hoyA=new Date().getFullYear(); y=Number(y||anioCrono());
  if(y<hoyA) return 48;
  if(y>hoyA) return -1;
  return semDeFecha(today());
}
const semActual=()=>semDeFecha(today());
function proximaSemana(p){
  const s=(p.semanas||[]).slice().sort((a,b)=>a-b), ac=semActual();
  const n=s.find(x=>x>=ac);
  if(n===undefined&&!s.length) return null;
  const idx=n===undefined?s[0]:n;
  const f=fechaDeSem(idx), anio=n===undefined?1:0;
  return {idx,txt:MESES[Math.floor(idx/4)]+' S'+((idx%4)+1)+(anio?' ('+(DB.config.anio+1)+')':''),
          dias:daysBetween(today(),f)+(anio?365:0)};
}

let fCr={area:'',activo:'',tipo:'',frec:'',q:'',atrasadas:false,mes:''};
function planesCrono(){
  return DB.planes.filter(p=>{
    const a=DB.activos.find(x=>x.id===p.activo)||{};
    if(fCr.area&&a.area!==fCr.area) return false;
    if(fCr.activo&&p.activo!==fCr.activo) return false;
    if(fCr.tipo&&(p.tipoMtto||'Preventivo')!==fCr.tipo) return false;
    if(fCr.frec&&(p.frec||'')!==fCr.frec) return false;
    if(fCr.q&&!((p.activo+' '+p.nombre+' '+(a.nombre||'')).toLowerCase().includes(fCr.q.toLowerCase()))) return false;
    if(fCr.mes!==''&&!(p.semanas||[]).some(w=>Math.floor(w/4)===Number(fCr.mes))) return false;
    if(fCr.atrasadas){
      const ac=semActualDe(), ej=ejecSem(p), na=noApSem(p);
      if(!(p.semanas||[]).some(w=>w<ac && !ej.includes(w) && !na.includes(w))) return false;
    }
    return true;
  });
}
function vCrono(){

  const L=planesCrono(), ac=semActualDe(AN), editable=edita('crono');
  const desprogC=planesDesprogramados();
  acts(`${desprogC.length&&edita('crono')?`<button class="btn alerta" onclick="reprogramarPorFrecuencia()">⟳ Reprogramar según frecuencia (${desprogC.length})</button>`:''}

  const alaFecha=L.reduce((s,p)=>{const na=noApSem(p,AN);return s+(p.semanas||[]).filter(w=>w<=ac&&!na.includes(w)).length;},0);
  const cumpl=alaFecha?(ejec/alaFecha)*100:0;
  const porMes=MESES.map((m,i)=>({label:m,value:L.reduce((s,p)=>s+(p.semanas||[]).filter(w=>Math.floor(w/4)===i).length,0)}));
  set(`

    ${campoBuscar('q_cr',fCr.q,'fCr.q=this.value;vCrono()','Buscar equipo o actividad…',250)}
    <select onchange="fCr.area=this.value;fCr.activo='';vCrono()"><option value="">Todas las áreas</option>
      ${DB.areas.map(a=>`<option ${fCr.area===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
    <select onchange="fCr.activo=this.value;vCrono()"><option value="">Todos los equipos</option>
      ${DB.activos.filter(a=>!fCr.area||a.area===fCr.area).map(a=>`<option value="${a.id}" ${fCr.activo===a.id?'selected':''}>${esc(a.id+' · '+a.nombre)}</option>`).join('')}</select>
    <select onchange="fCr.frec=this.value;vCrono()"><option value="">Toda frecuencia</option>
      ${FRECS.filter(f=>f!=='Personalizada').map(f=>`<option ${fCr.frec===f?'selected':''}>${f}</option>`).join('')}</select>
    <select onchange="fCr.tipo=this.value;vCrono()"><option value="">Todo tipo</option>
      ${TIPOS_MTTO.map(t=>`<option ${fCr.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
    <button class="btn sm ${fCr.atrasadas?'p':''}" onclick="fCr.atrasadas=!fCr.atrasadas;vCrono()">⚠ Solo atrasadas</button>
    <button class="btn sm gh" onclick="fCr={area:'',activo:'',tipo:'',frec:'',q:'',atrasadas:false,mes:''};vCrono()">Limpiar</button>
    <span class="hint" style="margin-left:auto">${L.length} de ${DB.planes.length} actividades</span>
  </div>
  <div class="grid g4" style="margin-bottom:16px">
    ${tile('Actividades del plan',L.length,'','','Cronograma '+AN)}
    ${tile('Intervenciones programadas',prog,'','v','Suma de semanas de '+AN)}
    ${tile('Ejecutadas',ejec,'','g',num(cumpl,1)+'% de lo programado a la fecha')}
    <div onclick="fCr.atrasadas=true;vCrono()" style="cursor:pointer" title="Ver solo las atrasadas">
      ${tile('Atrasadas',vencidas,'',vencidas?'r':'g','Pulsa para ver solo estas')}</div>
  </div>
  <div class="grid" style="grid-template-columns:1.4fr .6fr;margin-bottom:16px">
    <div class="card"><div class="ch"><div><h3>CARGA DE TRABAJO POR MES</h3><p>Intervenciones programadas en el año</p></div></div>
      ${svgBar(porMes,{h:190,fmt:v=>num(v,0)})}</div>
    <div class="card"><div class="ch"><div><h3>CUMPLIMIENTO DEL CRONOGRAMA</h3><p>${ac<0?'Año aún no iniciado':ac>=48?'Año cerrado · 48 de 48 semanas':'A la semana '+(ac+1)+' de 48'}</p></div></div>
      <div style="display:flex;justify-content:center">${svgGauge(cumpl,'META 95%')}</div>
      ${miniFila('Programadas a la fecha',num(alaFecha,0))}${miniFila('Ejecutadas',num(ejec,0))}
      ${miniFila('Atrasadas',num(vencidas,0))}</div>
  </div>
  <div class="card">
    <div class="ch"><div><h3>MT-CR-01 · CRONOGRAMA DE MANTENIMIENTO PREVENTIVO Y LUBRICACIÓN ${AN}</h3>
      <p>${editable?'Haz clic en una celda para marcar: programado → ejecutado → libre':'Consulta del programa anual (solo lectura para tu rol)'}</p></div></div>
    ${fCr.atrasadas?`<div class="aviso r" style="margin-bottom:12px">Estás viendo <b>solo las actividades con semanas atrasadas</b>.
      <button class="btn sm" style="margin-left:8px" onclick="fCr.atrasadas=false;vCrono()">Ver todas</button></div>`:''}

      <span><i style="background:#22c55e"></i>Ejecutado</span>
      <span><i style="background:#c23b3b"></i>Atrasado</span>
      <span><i style="background:#f59e0b"></i>Semana en curso</span>
      <span><i style="background:#cbd2da"></i>No aplica (antes del arranque del programa)</span>
    </div>
    ${rejillaCrono(L,ac)}
  </div>`);
  const t=document.getElementById('gridCr');
  if(t&&editable) t.onclick=e=>{
    const c=e.target.closest('td[data-p]'); if(!c) return;

  };
}
function rejillaCrono(L,ac){
  if(!L.length) return '<div class="empty">No hay actividades que coincidan con el filtro.</div>';
  /* Con un mes elegido la rejilla muestra solo esas cuatro semanas */
  const unMes = fCr.mes!=='' ? Number(fCr.mes) : null;
  const meses = unMes===null ? MESES.map((m,i)=>({m,i})) : [{m:MESES[unMes],i:unMes}];
  const semanas=[]; meses.forEach(x=>{ for(let k=0;k<4;k++) semanas.push(x.i*4+k); });
  let h=`<div class="twrap" style="max-height:64vh"><table class="crono" id="gridCr"><thead>
    <tr><th rowspan="2" style="min-width:92px">Código</th><th rowspan="2" style="min-width:150px">Equipo</th>
        <th rowspan="2" style="min-width:270px">Actividad</th><th rowspan="2">Tipo</th><th rowspan="2">Frecuencia</th>
        ${meses.map(x=>`<th colspan="4" class="cm">${x.m}</th>`).join('')}</tr>
    <tr>${meses.map(()=>[1,2,3,4].map(n=>`<th class="cw">${n}</th>`).join('')).join('')}</tr></thead><tbody>`;
  let ult='';
  L.forEach(p=>{
    const a=DB.activos.find(x=>x.id===p.activo)||{};
    const nuevo=p.activo!==ult; ult=p.activo;
    const sem=p.semanas||[], ej=ejecSem(p,ANIO_CR), na=noApSem(p,ANIO_CR);
    h+=`<tr${nuevo?' class="grp"':''}><td>${nuevo?'<b>'+esc(p.activo)+'</b>':''}</td>
      <td>${nuevo?esc(a.nombre||''):''}</td><td title="${esc(p.nombre)}">${esc(p.nombre)}</td>
      <td><span class="tag ${(p.tipoMtto||'')==='Lubricación'?'t-w':'t-b'}">${esc(p.tipoMtto||'Preventivo')}</span></td>
      <td>${esc(p.frec||'—')}</td>`;
    semanas.forEach(w=>{
      const pr=sem.includes(w), ex=ej.includes(w), noap=pr&&!ex&&na.includes(w);
      let cl='cc';
      if(ex) cl+=' ce'; else if(noap) cl+=' cx'; else if(pr&&w<ac) cl+=' cv'; else if(pr) cl+=p.semExcel?' cp':' cd';
      if(w===ac) cl+=' cn';
      if(w%4===3) cl+=' cb';
      h+=`<td class="${cl}" data-p="${p.id}" data-w="${w}" title="${MESES[Math.floor(w/4)]} semana ${(w%4)+1}${ex?' · ejecutado':noap?' · no aplica (antes del arranque)':pr?' · programado':''}"></td>`;
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}
function toggleSem(pid,w){
  const p=DB.planes.find(x=>x.id===pid); if(!p) return;
  p.semanas=p.semanas||[];
  const AN=anioCrono(); const ej=ejecSemEd(p,AN);
  /* Una celda "no aplica" se libera con el primer clic: vuelve a su ciclo normal
     programado → ejecutado → libre, en vez de quedar bloqueada. */
  if(p.semNoAplicaA && Array.isArray(p.semNoAplicaA[String(AN)]) && p.semNoAplicaA[String(AN)].includes(w)){
    p.semNoAplicaA[String(AN)]=p.semNoAplicaA[String(AN)].filter(x=>x!==w);
    store(); vCrono(); return;
  }
  const pr=p.semanas.includes(w), ex=ej.includes(w);
  if(!pr&&!ex){ p.semanas.push(w); }
  else if(pr&&!ex){ ej.push(w); const f=fechaDeSem(w,AN); if(!p.ultima||f>p.ultima) p.ultima=f; }
  else { p.semanas=p.semanas.filter(x=>x!==w); p.semEjecA[String(AN)]=ej.filter(x=>x!==w); }
  p.semanas.sort((a,b)=>a-b); (p.semEjecA[String(AN)]||[]).sort((a,b)=>a-b); espejoEjec(p);
  store(); vCrono();
}
function expCrono(){
  const cols=['Codigo','Equipo','Area','Actividad','Tipo','Responsable','Frecuencia','IntervaloDias','DuracionH','Programadas','Ejecutadas','Origen']
    .concat(MESES.flatMap(m=>[1,2,3,4].map(n=>m+' S'+n)));
  csv('MT-CR-01_Cronograma_'+DB.config.anio,cols, planesCrono().map(p=>{
    const a=DB.activos.find(x=>x.id===p.activo)||{}, sem=p.semanas||[], ej=ejecSem(p,ANIO_CR), na=noApSem(p,ANIO_CR);
    return [p.activo,a.nombre||'',a.area||'',p.nombre,p.tipoMtto||'Preventivo',p.resp,p.frec||'',p.intervalo,p.dur,
      sem.filter(w=>!na.includes(w)).length,ej.length,p.semExcel?'MT-CR-01':'Propuesta por frecuencia']
      .concat(Array.from({length:48},(_,w)=>na.includes(w)?'N/A':(ej.includes(w)?'E':(sem.includes(w)?'P':''))));
  }));
}

const VERSION=4;
function pantallaError(e,ctx){

  const st=(e&&e.stack)?String(e.stack).split('\n').slice(0,6).join('\n'):'';
  try{ document.getElementById('app').classList.remove('home'); }catch(_){}
  const v=document.getElementById('view');
  if(!v){ document.body.innerHTML='<pre style="color:#182430;padding:20px">'+msg+'</pre>'; return; }
  v.innerHTML=`<div style="max-width:660px;margin:40px auto">
    <div class="card" style="border-color:#e3b3ac">
      <div class="ch"><div><h3 style="color:#c23b3b">NO SE PUDO MOSTRAR ESTA PANTALLA</h3>

      <p class="hint" style="font-size:13px;margin-bottom:12px">El sistema detectó un problema y lo detuvo aquí en lugar de dejarte una pantalla en blanco.
        Lo más común es que los datos guardados en este navegador vengan de una versión anterior del archivo.</p>
      <div style="background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;
        font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#8a2c25;white-space:pre-wrap;margin-bottom:16px">${esc(msg)}\n${esc(st)}</div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn" onclick="try{expJSON()}catch(e){}">↓ Descargar respaldo de mis datos</button>
        <button class="btn" onclick="VISTA='inicio';render()">Volver al panel</button>
        <button class="btn p" onclick="restablecer()">⟳ Volver a descargar del servidor</button>
        <button class="btn" onclick="salir()">Cerrar sesión</button>
      </div>
    </div></div>`;
}
async function restablecer(){
  if(!confirm('Se descartará la copia local y se volverá a descargar todo desde el servidor.\n\n¿Continuar?')) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  try{ await cargarTodo(); VISTA='inicio'; render(); toast('Información recargada desde el servidor'); }
  catch(e){ pantallaError(e,'recarga'); }
}
if(typeof window!=='undefined'){
  window.onerror=function(m,src,l,c,err){ try{ pantallaError(err||m,'error global'); }catch(_){} };
}

/* ---------- Aviso de datos de una versión anterior ---------- */
function cargarMTCR(){
  if(!esAdmin()) return toast('Sólo el administrador puede reponer el catálogo','err');
  if(!confirm('Se repondrán los 36 equipos y las 281 actividades del MT-CR-01 en el servidor, para todos los usuarios.\n\n¿Continuar?')) return;
  const s0=seed();
  const idsAct=new Set(DB.activos.map(a=>a.id));
  s0.activos.forEach(a=>{ if(!idsAct.has(a.id)) DB.activos.push(a); });
  const claves=new Set(DB.planes.map(p=>p.activo+'|'+p.nombre));
  s0.planes.forEach(p=>{ if(!claves.has(p.activo+'|'+p.nombre)) DB.planes.push(p); });
  // también los formatos base, si la base está recién instalada
  ['checklists','indeci','objetivos','organigrama','flujo'].forEach(k=>{
    if(!DB[k] || !DB[k].length) DB[k]=(s0[k]||[]).slice(); });
  if(!DB.politica) DB.politica=s0.politica;
  if(!DB.areas || !DB.areas.length) DB.areas=s0.areas.slice();
  if(!DB.tecnicos || !DB.tecnicos.length) DB.tecnicos=s0.tecnicos.slice();
  store(); closeModal(); VISTA='pm';
  try{ render(); }catch(e){ return pantallaError(e,'pm'); }
  toast('Cargado: '+DB.activos.length+' equipos, '+DB.planes.length+' actividades, '+DB.checklists.length+' checklists y '+DB.indeci.length+' registros de seguridad');
}

function formUbicacion(id){

function existTotal(articulo){

/* ---------- Movimientos: los aplica el servidor (kardex y costo promedio) ---------- */
async function crearMovimiento(mov){
  await guardarYa();          // nada local sin guardar antes de que el servidor calcule el kardex
  mov.id=mov.id||uid('MOV'); mov.folio=mov.folio||folio('MOV','movimientos');
  mov.usuario=SESION.nombre; mov.fecha=mov.fecha||today();
  /* La empresa viaja dentro del propio movimiento: sin ella el servidor lo rechaza,
     porque la regla de seguridad comprueba que el registro sea de una empresa mía. */
  if(!mov.empresa) mov.empresa=EMPRESA||(SESION&&SESION.empresa)||'';
  if(SB && !mov.empresa){
    toast('No hay empresa activa en esta sesión. Vuelve a entrar y elige la empresa.','err');
    return null;
  }
  if(!SB){ DB.movimientos.push(mov); return mov; }
  const {error}=await SB.from('movimientos').insert(
    {id:mov.id,data:mov,actualizado_por:SESION.nombre});
  if(error){ toast(/policy|permission/i.test(error.message)
      ?'El servidor rechazó el movimiento. Revisa que tu usuario esté activo y tenga rol Administrador, Planificador, Almacén o Técnico en esta empresa.'
      :'No se pudo registrar: '+error.message,'err');
    return null; }
  await refrescarAlmacen();
  return mov;
}
async function refrescarAlmacen(){
  if(!SB) return;
  for(const t of ['movimientos','existencias','articulos']){
    const {data}=await SB.from(t).select('id,data');
    if(!data) continue;
    const srv=data.map(x=>Object.assign({},x.data,{id:x.id}));
    const ids=new Set(srv.map(o=>o.id));
    const locales=(DB[t]||[]).filter(o=>o&&o.id&&!ids.has(o.id));  // aún no confirmados
    DB[t]=srv.concat(locales);
    SNAP[t]={}; srv.forEach(o=>SNAP[t][o.id]=JSON.stringify(o));
  }
  cache();
}

/* Resumen de dónde está guardado cada material */
function tarjetaUbicaciones(){
  const act=(DB.articulos||[]).filter(a=>a.activo!==false);
  if(!act.length) return '';
  const mapa={};
  act.forEach(a=>{ const u=(a.ubicacion||'').trim()||'__sin';
    if(!mapa[u]) mapa[u]={n:0,valor:0};
    mapa[u].n++; mapa[u].valor+=existTotal(a.id)*(Number(a.costo_promedio)||0); });
  const sin=(mapa['__sin']||{n:0}).n;
  const filas=Object.entries(mapa).filter(([u])=>u!=='__sin')
    .sort((x,y)=>y[1].n-x[1].n)
    .map(([u,d])=>[`<span class="tag t-b">▤ ${esc(u)}</span>`,d.n,money(d.valor),
      `<div class="rowend"><button class="btn sm" onclick="fAr={q:'',cat:'',tipo:'',estado:'',equipo:'',ubic:'${js(u).replace(/'/g,"&#39;")}'};ir('articulos')">Ver artículos</button></div>`]);
  return `<div class="card" style="margin-bottom:16px">
    <div class="ch"><div><h3>UBICACIÓN DE LOS MATERIALES</h3>
      <p>Dónde está guardado cada repuesto: pasillo, estante, nivel</p></div>
      ${sin?`<button class="btn sm ${sin?'alerta':''}" onclick="fAr={q:'',cat:'',tipo:'',estado:'',equipo:'',ubic:'__sin'};ir('articulos')">⚠ ${sin} sin ubicar</button>`:''}</div>
    ${tabla([{t:'Ubicación'},{t:'Artículos',num:1},{t:'Valor almacenado',num:1},{t:''}],filas,
      'Ningún material tiene ubicación todavía. Pon la ubicación desde el catálogo o con el botón «Ubicar».')}
  </div>`;
}

async function okMovimiento(){
  const tipo=val('tipo'), a=val('articulo'), cant=valn('cantidad');
  if(!a) return toast('Selecciona el artículo','err');
  if(!cant) return toast('La cantidad no puede ser cero','err');
  const resta=['Salida a OT','Merma'].includes(tipo);
  const signo=resta?-1:1;
  const alm=val('almacen');
  if(resta && Math.abs(cant)>existTotal(a)) return toast('No hay existencia suficiente: hay '+num(existTotal(a),2),'err');
  const cu=valn('costo')||Number(art(a).costo_promedio)||0;
  const ok=await crearMovimiento({tipo,fecha:val('fecha'),articulo:a,almacen:alm,
    cantidad:signo*Math.abs(cant),costo_unitario:cu,costo_total:Math.abs(cant)*cu,
    referencia:val('ref'),observaciones:val('obs')});
  if(ok){ closeModal(); render(); toast('Movimiento '+ok.folio+' registrado'); }
}

  modal('Inventario físico — ajustar existencia',

    F.row(F.sel('Almacén','almacen',DB.almacenes.map(a=>({v:a.id,t:a.nombre})),almacenPrin()),
          F.numf('Cantidad contada físicamente','contado',0,'0.01'))+
    F.txt('Motivo del ajuste','motivo','','Ej. Inventario físico de julio')+
    `<p class="hint">Se generará un movimiento de <b>Ajuste por inventario</b> con la diferencia entre lo contado y lo que dice el sistema.
      Queda registrado quién lo hizo y por qué: eso es lo que pide una auditoría.</p>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn p" onclick="okInventario()">Aplicar ajuste</button>`);

async function okInventario(){
  const a=val('articulo'); if(!a) return toast('Selecciona el artículo','err');
  const alm=val('almacen'), contado=valn('contado');
  const actual=exist(a,alm).cantidad||0;
  const dif=contado-actual;
  if(!dif) return toast('No hay diferencia: la existencia ya coincide','err');
  const ok=await crearMovimiento({tipo:'Ajuste por inventario',fecha:today(),articulo:a,almacen:alm,
    cantidad:dif,costo_unitario:Number(art(a).costo_promedio)||0,
    costo_total:Math.abs(dif)*(Number(art(a).costo_promedio)||0),
    referencia:'Inventario físico',observaciones:val('motivo')+' · sistema '+num(actual,2)+' vs contado '+num(contado,2)});
  if(ok){ closeModal(); render(); toast('Ajuste aplicado: '+(dif>0?'+':'')+num(dif,2)); }
}

async function entregarMaterial(id){
  const m=DB.ot_materiales.find(x=>x.id===id); if(!m) return;
  const cu=Number(art(m.articulo).costo_promedio)||0;
  const mov=await crearMovimiento({tipo:'Salida a OT',fecha:today(),articulo:m.articulo,almacen:almacenPrin(),
    cantidad:-Math.abs(m.cantidad_solicitada),costo_unitario:cu,
    costo_total:Math.abs(m.cantidad_solicitada)*cu,referencia:m.ot,
    observaciones:'Entrega de material a la orden '+m.ot});
  if(!mov) return;
  m.estado='Entregado'; m.cantidad_entregada=m.cantidad_solicitada;
  m.costo_unitario=cu; m.importe=m.cantidad_solicitada*cu; m.entregado_por=SESION.nombre; m.fecha_entrega=today();
  save('Material entregado a '+m.ot+' · el costo ya está en la orden');
}
function marcarSinStock(id){
  const m=DB.ot_materiales.find(x=>x.id===id); if(!m) return;
  m.estado='Sin stock';
  // La orden pasa a "En espera repuesto" por disparador en el servidor: almacén
  // no tiene permiso para escribir en las OTs, y así queda registrado igual.
  save('Marcado sin existencia · la orden queda en espera de repuesto');
}

  return `<div style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)">

let LINEAS_TMP=[];
function agregarLinea(id){
  const a=val('nl_art'), d=val('nl_desc'), c=valn('nl_cant');
  if(!a&&!d) return toast('Elige un artículo o escribe la descripción','err');
  if(c<=0) return toast('La cantidad debe ser mayor que cero','err');
  LINEAS_TMP.push({id:uid('RQL'),requisicion:id||'',articulo:a,descripcion_libre:d,cantidad:c,

  toast('Renglón agregado');

function okRequis(id,estado){
  const ln=(id?DB.requisicion_lineas.filter(x=>x.requisicion===id):[]).concat(LINEAS_TMP);
  if(!ln.length) return toast('Agrega al menos un renglón','err');
  const r=DB.requisiciones.find(x=>x.id===id)||{id:uid('REQ'),folio:folio('REQ','requisiciones')};
  Object.assign(r,{fecha:val('fecha'),solicitante:r.solicitante||SESION.nombre,area:SESION.area||DB.config.area,
    prioridad:val('prioridad'),ot:val('ot'),justificacion:val('justificacion'),estado,
    aprobado_por:estado==='Enviada'?'':(r.aprobado_por||'')});
  if(!id) DB.requisiciones.push(r);
  LINEAS_TMP.forEach(l=>{ l.requisicion=r.id; DB.requisicion_lineas.push(l); });
  LINEAS_TMP=[];
  save(estado==='Enviada'?'Requisición '+r.folio+' enviada a aprobación':'Borrador guardado');

  const r=DB.requisiciones.find(x=>x.id===id); if(!r) return;

  modal('Requisición '+(r.folio||id),
    `<div class="grid g2" style="margin-bottom:12px">

function decidirRequis(id,aprueba){
  if(!soyGestorApp()) return toast('Solo el jefe o el planificador pueden aprobar requisiciones','err');
  const r=DB.requisiciones.find(x=>x.id===id); if(!r) return;
  r.estado=aprueba?'Aprobada':'Rechazada';
  r.aprobado_por=SESION.nombre; r.fecha_aprobacion=today();
  save('Requisición '+r.folio+' '+(aprueba?'aprobada':'rechazada'));

function reqDesdeFaltantes(){
  const falt=DB.articulos.filter(a=>a.activo!==false&&estadoArt(a)!=='Normal');
  if(!falt.length) return toast('No hay artículos por debajo de su punto de reorden');
  crearRequisAuto(falt.map(a=>({articulo:a.id,cantidad:Math.max(1,(Number(a.stock_max)||0)-existTotal(a.id))})),
    'Reposición automática por punto de reorden','');
}
function reqDesdeSinStock(){
  const sin=DB.ot_materiales.filter(m=>m.estado==='Sin stock');
  if(!sin.length) return toast('No hay material pendiente por falta de existencia');
  crearRequisAuto(sin.map(m=>({articulo:m.articulo,cantidad:m.cantidad_solicitada})),
    'Material requerido por órdenes de trabajo detenidas',sin[0].ot);
}
function crearRequisAuto(lineas,justif,ot){
  const r={id:uid('REQ'),folio:folio('REQ','requisiciones'),fecha:today(),solicitante:SESION.nombre,
    area:SESION.area||DB.config.area,prioridad:'Alta',estado:'Borrador',ot:ot||'',justificacion:justif};
  DB.requisiciones.push(r);
  lineas.forEach(l=>DB.requisicion_lineas.push({id:uid('RQL'),requisicion:r.id,articulo:l.articulo,
    descripcion_libre:'',cantidad:l.cantidad,unidad:art(l.articulo).unidad||'Pieza',fecha_requerida:'',estado:'Pendiente'}));
  VISTA='requis';
  save('Requisición '+r.folio+' creada con '+lineas.length+' renglones — revísala y envíala a aprobación');
}
function expRequis(){
  const rows=[];
  DB.requisiciones.forEach(r=>DB.requisicion_lineas.filter(l=>l.requisicion===r.id).forEach((l,i)=>
    rows.push([r.folio||r.id,r.fecha,r.solicitante,r.area||'',r.estado,r.prioridad||'',r.ot||'',
      i+1,l.articulo||l.descripcion_libre,l.cantidad,l.unidad||'',r.aprobado_por||''])));
  csv('Requisiciones',['Folio','Fecha','Solicita','Area','Estado','Prioridad','OT','Renglon','Articulo','Cantidad','Unidad','Aprobo'],rows);
}

async function okRecepcion(ocId){
  const o=DB.ordenes_compra.find(x=>x.id===ocId); if(!o) return;
  const ln=DB.oc_lineas.filter(l=>l.orden_compra===ocId);
  const alm=val('almacen'), fecha=val('fecha');
  const rec={id:uid('REC'),folio:folio('REC','recepciones'),fecha,orden_compra:ocId,almacen:alm,
    remision:val('remision'),factura:val('factura'),recibido_por:SESION.nombre,estado:'Parcial'};
  let algo=false; const recibido={};
  for(let i=0;i<ln.length;i++){
    const cant=Number(document.getElementById('f_rc'+i).value)||0;
    if(cant<=0) continue;
    const mov=await crearMovimiento({tipo:'Entrada por compra',fecha,articulo:ln[i].articulo,almacen:alm,
      cantidad:Math.abs(cant),costo_unitario:Number(ln[i].precio_unitario)||0,
      costo_total:Math.abs(cant)*(Number(ln[i].precio_unitario)||0),referencia:o.folio||ocId,
      observaciones:'Recepción '+rec.folio});
    if(!mov) return;
    recibido[ln[i].id]=cant;
    DB.recepcion_lineas.push({id:uid('RCL'),recepcion:rec.id,oc_linea:ln[i].id,articulo:ln[i].articulo,
      cantidad_recibida:cant,cantidad_rechazada:0,motivo_rechazo:'',lote:'',caducidad:'',movimiento:mov.id});
    algo=true;
  }
  if(!algo) return toast('No capturaste ninguna cantidad a recibir','err');
  // El avance de los renglones y el estado de la orden los aplica el servidor:
  // almacén no tiene permiso de escritura sobre las compras.
  const completo=ln.every(l=>((Number(l.cantidad_recibida)||0)+(recibido[l.id]||0))>=(Number(l.cantidad)||0));
  rec.estado=completo?'Completa':'Parcial';
  DB.recepciones.push(rec);
  closeModal();
  save('Recepción '+rec.folio+' registrada · el material ya está en almacén');
}

      DB.articulo_equipo.push({id:uid('AE'),articulo:cod,activo:eq,cantidad_por_equipo:1,observacion:''}); vinc++; }});
  });

    responsable:'Encargado de almacén',ubicacion:'Taller de mantenimiento',activo:true});

  toast('Catálogo cargado: '+nuevos+' artículos y '+vinc+' vínculos con equipos');

}

   FOTOS EN LAS ÓRDENES DE TRABAJO
   ========================================================= */
const FOTO_MAX_PX=1600, FOTO_CALIDAD=0.72, FOTO_MAX_MB=8;

/* Reduce la foto antes de subirla: un celular saca 4 MB por imagen y
   así viaja alrededor de 200 KB, que es lo que aguanta el dato móvil. */
function comprimirImagen(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type)) return rej(new Error('"'+file.name+'" no es una imagen'));
    if(file.size>FOTO_MAX_MB*1024*1024) return rej(new Error('"'+file.name+'" pesa más de '+FOTO_MAX_MB+' MB'));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      if(!w||!h){ URL.revokeObjectURL(url); return rej(new Error('no se pudo leer la imagen')); }
      if(Math.max(w,h)>FOTO_MAX_PX){ const f=FOTO_MAX_PX/Math.max(w,h); w=Math.round(w*f); h=Math.round(h*f); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(url);
        b?res(b):rej(new Error('no se pudo procesar la imagen')); },'image/jpeg',FOTO_CALIDAD);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('no se pudo abrir "'+file.name+'"')); };
    img.src=url;
  });
}
async function subirFotoOT(otId,file){
  const b=await comprimirImagen(file);
  const nom=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const ruta=(EMPRESA||'AV')+'/'+otId+'/'+nom;
  const {error}=await SB.storage.from('fotos').upload(ruta,b,{contentType:'image/jpeg',upsert:false});
  if(error) throw new Error(error.message);
  const {data}=SB.storage.from('fotos').getPublicUrl(ruta);
  return {ruta,url:(data&&data.publicUrl)||'',fecha:today(),usuario:SESION.nombre,
    tam:b.size,original:file.name};
}
async function agregarFotosOT(otId,inp){
  const o=DB.ots.find(x=>x.id===otId); if(!o) return;
  const files=[...(inp.files||[])]; if(!files.length) return;
  inp.disabled=true;
  o.fotos=Array.isArray(o.fotos)?o.fotos:[];
  let ok=0, fallos=[];
  for(const f of files){
    try{ o.fotos.push(await subirFotoOT(otId,f)); ok++; }
    catch(e){ fallos.push(e.message); }
  }
  inp.disabled=false; inp.value='';
  if(ok){ store(); pintarFotos(otId); }
  if(fallos.length) toast('No se subieron '+fallos.length+': '+fallos[0],'err');
  if(ok) toast(ok===1?'Foto subida':ok+' fotos subidas');
}
async function borrarFotoOT(otId,ruta){
  const o=DB.ots.find(x=>x.id===otId); if(!o||!Array.isArray(o.fotos)) return;
  if(!confirm('¿Eliminar esta foto de la orden?')) return;
  try{ await SB.storage.from('fotos').remove([ruta]); }catch(e){}
  o.fotos=o.fotos.filter(f=>f.ruta!==ruta);
  store(); pintarFotos(otId); toast('Foto eliminada');
}

      Puedes seguir agregando más después, desde "Ver" en el registro de OTs.</p>`+
    bloqueFotos(o),
    `<button class="btn p" onclick="closeModal()">Listo, sin más fotos por ahora</button>`);
}

if(LOGO_URL){
  const bd=document.getElementById('brand');
  if(bd){
    bd.style.textAlign='center';
    bd.insertAdjacentHTML('afterbegin',
      `<img src="${LOGO_URL}" alt="Logo" style="display:block;height:46px;width:auto;max-width:100%;object-fit:contain;margin:0 auto 10px">`);
  }
}
arrancar();
</script>
